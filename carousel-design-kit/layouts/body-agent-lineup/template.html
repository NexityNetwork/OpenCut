<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0B0B0C;color:#FAFAF9;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(250,250,249,.78);--faint:rgba(250,250,249,.56);--rule:rgba(250,250,249,.16)}
.sheet{position:absolute;inset:0;padding:64px 76px 68px;display:flex;flex-direction:column}
h2{margin-top:0;font-size:82px;font-weight:600;line-height:1.02;letter-spacing:-.042em;max-width:900px}
.desc{margin-top:28px;font-size:31px;font-weight:400;line-height:1.42;color:var(--muted);max-width:850px}
.rows{margin-top:56px;flex:1;display:flex;flex-direction:column;min-height:0}
.row{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:32px;
  border-top:1px solid var(--rule)}
.row:last-child{border-bottom:1px solid var(--rule)}
.lft{display:flex;align-items:center;gap:22px;min-width:0}
.lft i{display:block;width:38px;height:38px;flex:0 0 auto}
.lft i svg{width:100%;height:100%;display:block}
.lft .n{font-size:34px;font-weight:600;letter-spacing:-.024em}
.lft .r{margin-top:7px;font-size:23px;font-weight:400;color:var(--muted)}
.out{font-size:28px;font-weight:500;letter-spacing:-.012em;white-space:nowrap}
.res{margin-top:56px;padding-left:26px;border-left:2px solid rgba(250,250,249,.30)}
.res .k{font-size:20px;font-weight:500;color:var(--faint)}
.res p{margin-top:12px;font-size:38px;font-weight:500;line-height:1.3;letter-spacing:-.028em;max-width:880px}
</style></head>
<body>
<div class="sheet">
  <h2>{{title}}</h2>
  <p class="desc">{{description}}</p>
  <div class="rows">
    <div class="row"><div class="lft"><i>{{iconSvg1}}</i><div><div class="n">{{toolName1}}</div><div class="r">{{toolRole1}}</div></div></div><div class="out">{{outcome1}}</div></div>
    <div class="row"><div class="lft"><i>{{iconSvg2}}</i><div><div class="n">{{toolName2}}</div><div class="r">{{toolRole2}}</div></div></div><div class="out">{{outcome2}}</div></div>
    <div class="row"><div class="lft"><i>{{iconSvg3}}</i><div><div class="n">{{toolName3}}</div><div class="r">{{toolRole3}}</div></div></div><div class="out">{{outcome3}}</div></div>
  </div>
  <div class="res"><div class="k">Result</div><p>{{resultText}}</p></div>
</div>
</body></html>
