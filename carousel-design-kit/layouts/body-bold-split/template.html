<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#F7F5EF;color:#1F1F1F;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
/* Ink on cream, and one slate. That is the whole palette. */
:root{--ink:#1F1F1F;--slate:#3C3C3C;--muted:#5C5C58;--line:#1F1F1F}
/* The angled slate panel is this family's signature — kept, cut deeper so it
   reads as a deliberate split rather than a stripe. */
.split{position:absolute;top:0;right:0;width:430px;height:100%;background:var(--slate);
  clip-path:polygon(24% 0,100% 0,100% 100%,46% 100%)}
/* Drawn mark: a dotted field, the same texture the family already used, now
   sized as a composition element instead of a badge behind a numeral. */
.dots{position:absolute;background-image:radial-gradient(circle,rgba(247,245,239,.75) 2.4px,transparent 2.8px);
  background-size:24px 24px;z-index:2;pointer-events:none}
.sheet{position:absolute;inset:0;padding:96px 80px 92px;display:flex;flex-direction:column;justify-content:center;z-index:3}
.dots{top:74px;right:56px;width:210px;height:210px}
.tag{font-size:24px;font-weight:600;color:var(--muted);letter-spacing:-.2px;max-width:640px}
.display{margin-top:18px;font-size:88px;font-weight:700;line-height:.98;letter-spacing:-3.4px;max-width:640px}
.body{margin-top:34px;font-size:30px;font-weight:400;line-height:1.46;color:var(--muted);max-width:620px}
.stats{margin-top:54px;width:640px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{padding:22px 22px 20px;background:#fff;border:1.5px solid var(--line);border-radius:14px}
.stat .v{font-size:40px;font-weight:700;line-height:1;letter-spacing:-1.6px}
.stat .l{margin-top:8px;font-size:19px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
</style></head>
<body>
<div class="split"></div>
<div class="dots"></div>
<div class="sheet">
  <div class="tag">{{stepTag}}</div>
  <div class="display">{{title}}</div>
  <p class="body">{{body}}</p>
  <div class="stats">
    <div class="stat"><div class="v">{{stat1V}}</div><div class="l">{{stat1L}}</div></div>
    <div class="stat"><div class="v">{{stat2V}}</div><div class="l">{{stat2L}}</div></div>
    <div class="stat"><div class="v">{{stat3V}}</div><div class="l">{{stat3L}}</div></div>
  </div>
</div>
</body></html>
