<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#1A1512;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#1A1512;--muted:rgba(26,21,18,.68);--rule:rgba(26,21,18,.16);--terra:#C2603A}
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 14% 14%, #F6E9DA 0%, transparent 56%),
  radial-gradient(100% 80% at 88% 8%,  #FDF7F0 0%, transparent 52%),
  radial-gradient(120% 95% at 78% 92%, #EBD9C4 0%, transparent 58%),
  radial-gradient(110% 90% at 4% 92%,  #FFFDFA 0%, transparent 54%),
  #F7EFE4}
.mesh.dark{background:
  radial-gradient(120% 90% at 16% 14%, #3A2A20 0%, transparent 56%),
  radial-gradient(100% 80% at 86% 8%,  #5A4030 0%, transparent 52%),
  radial-gradient(120% 95% at 76% 90%, #1E1510 0%, transparent 58%),
  radial-gradient(110% 90% at 6% 92%,  #2A1D15 0%, transparent 56%),
  #1A120D}
.grain{position:absolute;inset:0;z-index:5;opacity:.28;mix-blend-mode:multiply;pointer-events:none}
/* No console, no fake window chrome. An editorial page: the argument at
   the top, the findings on hairlines, and one material object. */
.sheet{position:absolute;inset:0;padding:132px 96px 120px;display:flex;flex-direction:column;justify-content:space-between;z-index:4}
.tag{font-size:25px;font-weight:600;color:var(--terra);letter-spacing:-.3px}
h2{margin-top:20px;font-size:88px;font-weight:600;line-height:1.0;letter-spacing:-3.3px;max-width:880px}
h2 b{font-weight:700;color:var(--terra)}
.sub{margin-top:30px;font-size:32px;font-weight:400;line-height:1.44;color:var(--muted);max-width:720px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:48px;
  padding:34px 0;border-top:1px solid var(--rule)}
.row:last-child{border-bottom:1px solid var(--rule)}
.row .t{font-size:33px;font-weight:600;letter-spacing:-1.1px}
.row .d{margin-top:9px;font-size:25px;font-weight:400;line-height:1.4;color:var(--muted);max-width:660px}
.row .m{font-size:26px;font-weight:600;color:var(--terra);letter-spacing:-.5px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:30px}
.tools i{display:block;width:36px;height:36px}
.tools i svg{width:100%;height:100%;display:block}
</style></head>
<body>
<div class="mesh"></div>
<div class="sheet">
  <div>
    <div class="tag">{{tag}}</div>
    <h2>{{title}} <b>{{titleItalic}}</b></h2>
    <p class="sub">{{subtitle}}</p>
  </div>
  <div class="rows">
    <div class="row"><div><div class="t">{{b1Title}}</div><div class="d">{{b1Body}}</div></div><div class="m">{{b1Metric}}</div></div>
    <div class="row"><div><div class="t">{{b2Title}}</div><div class="d">{{b2Body}}</div></div><div class="m">{{b2Metric}}</div></div>
    <div class="row"><div><div class="t">{{b3Title}}</div><div class="d">{{b3Body}}</div></div><div class="m">{{b3Metric}}</div></div>
  </div>
  <div class="tools"><i>{{iconSvg1}}</i><i>{{iconSvg2}}</i><i>{{iconSvg3}}</i><i>{{iconSvg4}}</i></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="44"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
