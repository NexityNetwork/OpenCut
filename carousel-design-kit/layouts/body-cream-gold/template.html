<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#17140F;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#17140F;--muted:rgba(23,20,15,.68);--rule:rgba(23,20,15,.16);--gold:#A47C2B}
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(110% 85% at 82% 6%,  #F7E9C9 0%, transparent 48%),
  radial-gradient(120% 90% at 14% 18%, #EFE4D0 0%, transparent 54%),
  radial-gradient(130% 100% at 74% 94%,#DCC79B 0%, transparent 58%),
  radial-gradient(110% 95% at 4% 96%,  #FEFCF7 0%, transparent 56%),
  #F4EDE0}
.mesh.dark{background:
  radial-gradient(90% 70% at 80% 8%,   #E0B457 0%, transparent 44%),
  radial-gradient(120% 90% at 20% 26%, #8A6520 0%, transparent 50%),
  radial-gradient(130% 100% at 68% 96%,#2E2110 0%, transparent 60%),
  radial-gradient(110% 95% at 4% 96%,  #100C06 0%, transparent 58%),
  #0D0A05}
.grain{position:absolute;inset:0;z-index:5;opacity:.28;mix-blend-mode:multiply;pointer-events:none}
/* A milled gold bar: banded highlights across a metal face, not a flat swatch.
   This is the family's one object and it is drawn, not pasted. */
.bar{position:absolute;z-index:2;border-radius:10px;overflow:hidden;
  background:linear-gradient(100deg,#8A6520 0%,#E8CE86 14%,#B9902F 27%,#F6E7B4 41%,
    #A47C2B 55%,#EBD494 69%,#8E6A22 83%,#D9BC6B 100%);
  box-shadow:0 26px 46px -18px rgba(80,58,14,.45), inset 0 1px 0 rgba(255,255,255,.5)}
.bar{right:0;top:0;width:22px;height:1350px;border-radius:0;
  background:linear-gradient(180deg,#8A6520 0%,#E8CE86 12%,#B9902F 26%,#F6E7B4 40%,
    #A47C2B 56%,#EBD494 70%,#8E6A22 84%,#D9BC6B 100%)}
.sheet{position:absolute;inset:0;padding:126px 118px 116px 96px;display:flex;flex-direction:column;justify-content:space-between;z-index:4}
.tool{display:flex;align-items:center;gap:18px}
.tool .n{font-size:36px;font-weight:700;letter-spacing:-1.2px}
.tool .r{margin-top:3px;font-size:23px;font-weight:500;color:var(--muted)}
h2{margin-top:26px;font-size:84px;font-weight:600;line-height:1.0;letter-spacing:-3.4px;max-width:820px}
h2 b{font-weight:700;color:var(--gold)}
.sub{margin-top:26px;font-size:31px;font-weight:400;line-height:1.44;color:var(--muted);max-width:760px}
.pillars{display:flex;flex-direction:column}
.p{display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:baseline;padding:30px 0;border-top:1px solid var(--rule)}
.p:last-child{border-bottom:1px solid var(--rule)}
.p .t{font-size:31px;font-weight:600;letter-spacing:-1px}
.p .d{font-size:26px;font-weight:400;line-height:1.42;color:var(--muted)}
.close{display:flex;align-items:baseline;justify-content:space-between;gap:40px}
.close .q{font-size:30px;font-weight:600;letter-spacing:-1px;max-width:660px}
.close .v{font-size:46px;font-weight:700;color:var(--gold);letter-spacing:-1.8px;white-space:nowrap}
</style></head>
<body>
<div class="mesh"></div>
<div class="sheet">
  <div>
    <div class="tool"><div><div class="n">{{toolName1}}</div><div class="r">{{toolTag}}</div></div></div>
    <h2>{{titleMain}} <b>{{titleItalic}}</b></h2>
    <p class="sub">{{body}}</p>
  </div>
  <div class="pillars">
    <div class="p"><div class="t">{{pillar1Title}}</div><div class="d">{{pillar1Body}}</div></div>
    <div class="p"><div class="t">{{pillar2Title}}</div><div class="d">{{pillar2Body}}</div></div>
    <div class="p"><div class="t">{{pillar3Title}}</div><div class="d">{{pillar3Body}}</div></div>
  </div>
  <div class="close"><div class="q">{{quoteText}}</div><div class="v">{{priceValue}}</div></div>
</div>
<div class="bar"></div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="57"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
