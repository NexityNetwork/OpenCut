<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#16130E;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#16130E;--muted:rgba(22,19,14,.66);--rule:rgba(22,19,14,.14);--accent:#C2542A}
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(110% 85% at 84% 6%,  #FBF3E6 0%, transparent 48%),
  radial-gradient(120% 90% at 12% 18%, #F2E7D6 0%, transparent 54%),
  radial-gradient(130% 100% at 76% 94%,#E4D3BB 0%, transparent 58%),
  radial-gradient(110% 95% at 4% 96%,  #FFFDF9 0%, transparent 56%),
  #F6EFE3}
.grain{position:absolute;inset:0;z-index:5;opacity:.28;mix-blend-mode:multiply;pointer-events:none}
.tile{border-radius:26%;background:#FFFCF7;display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 34px -14px rgba(70,44,18,.34), inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid rgba(22,19,14,.08)}
.tile svg{width:56%;height:56%;display:block}
.sheet{position:absolute;inset:0;padding:118px 88px 108px;display:flex;flex-direction:column;
  justify-content:space-between;z-index:4}
/* The instructional page: prose carries it, the screen is the evidence
   underneath rather than the subject. */
.head{display:flex;align-items:center;gap:24px}
.head .tile{width:86px;height:86px;flex:0 0 auto}
.head .lbl{font-size:27px;font-weight:500;color:var(--muted);letter-spacing:-.4px}
h2{margin-top:30px;font-size:78px;font-weight:700;line-height:1.02;letter-spacing:-3.2px;max-width:880px}
.lines{margin-top:38px;display:flex;flex-direction:column;gap:19px}
.lines p{font-size:31px;font-weight:400;line-height:1.4;color:rgba(22,19,14,.8);max-width:880px}
.lines p b{font-weight:600;color:var(--ink)}
.lines p.lead{color:var(--ink);font-weight:500}
/* Sized to the capture's own proportions so the whole screen is legible —
   a wide short band would slice a page in half and read as a mistake. */
.strip{position:relative;width:704px;height:440px;border-radius:20px;overflow:hidden;
  background:linear-gradient(166deg,#FDF8F0,#F1E5D2);
  border:1px solid rgba(22,19,14,.12);
  box-shadow:0 34px 60px -28px rgba(70,44,18,.4), inset 0 1px 0 rgba(255,255,255,.8)}
.strip .shot{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.strip .empty{position:absolute;inset:20px;border-radius:14px;
  border:1.5px dashed rgba(22,19,14,.17);display:flex;align-items:center;justify-content:center;
  color:rgba(22,19,14,.36);font-size:24px;font-weight:500;letter-spacing:-.35px}
</style></head>
<body>
<div class="mesh"></div>
<div class="sheet">
  <div>
    <div class="head"><div class="tile">{{iconSvg1}}</div><div class="lbl">{{toolTagline}}</div></div>
    <h2>{{noteTitle}}</h2>
    <div class="lines">
      <p class="lead">{{line1}}</p>
      <p>{{line2}}</p>
      <p>{{line3}}</p>
    </div>
  </div>
  <div class="strip">
    <img class="shot" src="{{shotSrc}}" onerror="this.outerHTML='&lt;div class=\'empty\'&gt;Your screenshot goes here&lt;/div&gt;'">
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="71"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
