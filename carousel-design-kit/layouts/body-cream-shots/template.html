<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#16130E;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#16130E;--muted:rgba(22,19,14,.66);--rule:rgba(22,19,14,.14);--accent:#C2542A}
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(110% 85% at 84% 6%,  #FBF3E6 0%, transparent 48%),
  radial-gradient(120% 90% at 12% 18%, #F2E7D6 0%, transparent 54%),
  radial-gradient(130% 100% at 76% 94%,#E4D3BB 0%, transparent 58%),
  radial-gradient(110% 95% at 4% 96%,  #FFFDF9 0%, transparent 56%),
  #F6EFE3}
.mesh.dark{background:
  radial-gradient(90% 70% at 80% 8%,   #E0824A 0%, transparent 44%),
  radial-gradient(120% 90% at 20% 26%, #8A3E18 0%, transparent 50%),
  radial-gradient(130% 100% at 68% 96%,#2A1409 0%, transparent 60%),
  radial-gradient(110% 95% at 4% 96%,  #100804 0%, transparent 58%),
  #0E0704}
.grain{position:absolute;inset:0;z-index:5;opacity:.28;mix-blend-mode:multiply;pointer-events:none}
.tile{border-radius:26%;background:#FFFCF7;display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 34px -14px rgba(70,44,18,.34), inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid rgba(22,19,14,.08)}
.tile svg{width:56%;height:56%;display:block}
/* The device frame is the point of this variant: the middle of every page is
   a slot the user fills with their own screenshot. */
.device{position:relative;border-radius:30px;overflow:hidden;
  background:linear-gradient(166deg,#FDF8F0,#F1E5D2);
  border:1px solid rgba(22,19,14,.12);
  box-shadow:0 46px 80px -32px rgba(70,44,18,.44), inset 0 1px 0 rgba(255,255,255,.8)}
.device .shot{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
/* Shown only when no screenshot has been supplied — a drop well, not a panel. */
.device .empty{position:absolute;inset:24px;border-radius:18px;
  border:1.5px dashed rgba(22,19,14,.17);display:flex;align-items:center;justify-content:center;
  color:rgba(22,19,14,.36);font-size:25px;font-weight:500;letter-spacing:-.35px}
.sheet{position:absolute;inset:0;padding:118px 88px 108px;display:flex;flex-direction:column;justify-content:space-between;z-index:4}
.hero{display:flex;align-items:center;gap:28px}
.hero .tile{width:128px;height:128px;flex:0 0 auto}
.hero .n{font-size:76px;font-weight:700;letter-spacing:-3.2px;line-height:1}
.hero .t{margin-top:8px;font-size:26px;font-weight:500;color:var(--muted);letter-spacing:-.4px}
.device{height:560px}
.claim{font-size:38px;font-weight:600;line-height:1.24;letter-spacing:-1.5px;max-width:900px}
.claim b{font-weight:700;color:var(--accent)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:32px;
  padding-top:26px;border-top:1px solid var(--rule)}
.foot .m{font-size:26px;font-weight:600;color:var(--accent)}
.foot .n{font-size:26px;font-weight:400;color:var(--muted)}
</style></head>
<body>
<div class="mesh"></div>
<div class="sheet">
  <div class="hero">
    <div class="tile">{{iconSvg1}}</div>
    <div><div class="n">{{toolName}}</div><div class="t">{{toolTagline}}</div></div>
  </div>
  <div class="device">
    <img class="shot" src="{{shotSrc}}" onerror="this.outerHTML='&lt;div class=\'empty\'&gt;Your screenshot goes here&lt;/div&gt;'">
  </div>
  <p class="claim">{{bigStatement}}</p>
  <div class="foot"><div class="n">{{useNote}}</div><div class="m">{{useMetric}}</div></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="71"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
