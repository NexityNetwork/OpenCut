<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#16130E;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#16130E;--muted:rgba(22,19,14,.66);--rule:rgba(22,19,14,.14);--accent:#C2542A}
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(110% 85% at 84% 6%,  #FBF3E6 0%, transparent 48%),
  radial-gradient(120% 90% at 12% 18%, #F2E7D6 0%, transparent 54%),
  radial-gradient(130% 100% at 76% 94%,#E4D3BB 0%, transparent 58%),
  radial-gradient(110% 95% at 4% 96%,  #FFFDF9 0%, transparent 56%),
  #F6EFE3}
.grain{position:absolute;inset:0;z-index:5;opacity:.28;mix-blend-mode:multiply;pointer-events:none}
.tile{border-radius:26%;background:#FFFCF7;display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 34px -14px rgba(70,44,18,.34), inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid rgba(22,19,14,.08)}
.tile svg{width:56%;height:56%;display:block}
.sheet{position:absolute;inset:0;padding:112px 88px 108px;display:flex;flex-direction:column;
  align-items:center;text-align:center;justify-content:space-between;z-index:4}
.sheet .tile{width:118px;height:118px}
h2{margin-top:32px;font-size:106px;font-weight:700;line-height:.96;letter-spacing:-4.6px}
/* A tablet shell rather than a bare frame: the dark bezel gives the cream
   ground something to push against, and the screen reads as a screen. */
.slab{padding:16px;border-radius:38px;background:#1B1712;
  box-shadow:0 48px 86px -32px rgba(70,44,18,.52), inset 0 1px 0 rgba(255,255,255,.14)}
.slab .inner{position:relative;width:824px;height:496px;border-radius:24px;overflow:hidden;
  background:linear-gradient(166deg,#FDF8F0,#F1E5D2)}
.slab .shot{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.slab .empty{position:absolute;inset:22px;border-radius:16px;
  border:1.5px dashed rgba(22,19,14,.17);display:flex;align-items:center;justify-content:center;
  color:rgba(22,19,14,.36);font-size:24px;font-weight:500;letter-spacing:-.35px}
.caption{font-size:44px;font-weight:600;letter-spacing:-1.6px}
.caption b{font-weight:700;color:var(--accent)}
.note{margin-top:16px;font-size:30px;font-weight:400;line-height:1.4;color:var(--muted);max-width:760px}
</style></head>
<body>
<div class="mesh"></div>
<div class="sheet">
  <div>
    <div class="tile">{{iconSvg1}}</div>
    <h2>{{toolName}}</h2>
  </div>
  <div class="slab">
    <div class="inner">
      <img class="shot" src="{{shotSrc}}" onerror="this.outerHTML='&lt;div class=\'empty\'&gt;Your screenshot goes here&lt;/div&gt;'">
    </div>
  </div>
  <div>
    <div class="caption">{{captionLine}}</div>
    <p class="note">{{toolTagline}}</p>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="71"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
