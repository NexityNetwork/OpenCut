<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#16130E;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#16130E;--muted:rgba(22,19,14,.66);--rule:rgba(22,19,14,.14);--accent:#C2542A}
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(110% 85% at 84% 6%,  #FBF3E6 0%, transparent 48%),
  radial-gradient(120% 90% at 12% 18%, #F2E7D6 0%, transparent 54%),
  radial-gradient(130% 100% at 76% 94%,#E4D3BB 0%, transparent 58%),
  radial-gradient(110% 95% at 4% 96%,  #FFFDF9 0%, transparent 56%),
  #F6EFE3}
.grain{position:absolute;inset:0;z-index:5;opacity:.28;mix-blend-mode:multiply;pointer-events:none}
.tile{border-radius:26%;background:#FFFCF7;display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 34px -14px rgba(70,44,18,.34), inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid rgba(22,19,14,.08)}
.tile svg{width:56%;height:56%;display:block}
.sheet{position:absolute;inset:0;padding:118px 88px 0;display:flex;flex-direction:column;
  align-items:center;text-align:center;z-index:4}
.sheet .tile{width:126px;height:126px}
h2{margin-top:38px;font-size:94px;font-weight:700;line-height:.98;letter-spacing:-3.9px}
.sub{margin-top:26px;font-size:33px;font-weight:400;line-height:1.38;color:var(--muted);max-width:800px}
/* The screen runs off the bottom edge on purpose — it reads as a window onto
   something larger rather than a card that happens to hold a picture. */
.stage{position:absolute;left:0;right:0;bottom:-120px;display:flex;justify-content:center;z-index:4}
/* Height follows the capture rather than being fixed: a tall box would crop a
   wide screen down its sides and cut the left edge off every sentence in it.
   This shape wants a taller capture — roughly 1120x970 — so the screen reaches
   up the page and still runs off the bottom edge. */
.device{width:892px;min-height:772px;position:relative;border-radius:32px;overflow:hidden;
  transform:rotate(-2.2deg);transform-origin:50% 100%;
  background:linear-gradient(166deg,#FDF8F0,#F1E5D2);
  border:1px solid rgba(22,19,14,.12);
  box-shadow:0 52px 92px -34px rgba(70,44,18,.46), inset 0 1px 0 rgba(255,255,255,.8)}
.device .shot{display:block;width:100%;height:auto}
.device .empty{position:absolute;inset:24px;border-radius:18px;
  border:1.5px dashed rgba(22,19,14,.17);display:flex;align-items:center;justify-content:center;
  color:rgba(22,19,14,.36);font-size:25px;font-weight:500;letter-spacing:-.35px}
</style></head>
<body>
<div class="mesh"></div>
<div class="sheet">
  <div class="tile">{{iconSvg1}}</div>
  <h2>{{toolName}}</h2>
  <p class="sub">{{toolTagline}}</p>
</div>
<div class="stage">
  <div class="device">
    <img class="shot" src="{{shotSrc}}" onerror="this.outerHTML='&lt;div class=\'empty\'&gt;Your screenshot goes here&lt;/div&gt;'">
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="71"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
