<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#17170F;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(23,23,15,.56);--rule:rgba(23,23,15,.14);--accent:#E0A93B;--ink:#17170F}
/* Warm paper, flat, no gradient. This family teaches, so the diagrams ARE the
   design — a chart, a flow and a table, each drawn properly instead of four
   competing colours doing the work a structure should do. Two colours: ink and
   one lime, with the lime always carrying ink type on top of it. */
.ground{position:absolute;inset:0;z-index:0;background:#FBF9F3}
.grain{position:absolute;inset:0;z-index:6;opacity:.18;mix-blend-mode:multiply;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:108px 80px 100px}
.head{display:flex;align-items:center;justify-content:space-between;gap:30px}
.head .lbl{font-size:27px;font-weight:600;letter-spacing:-.4px}
.head .tools{display:flex;align-items:center;gap:22px}
.head .tools svg{width:36px;height:36px;display:block}
h2{margin-top:26px;font-size:70px;font-weight:700;line-height:1.03;letter-spacing:-2.9px}
h2 em{font-style:normal;padding:0 2px;
  background:linear-gradient(to top,var(--accent) 0 16px,transparent 16px)}
.sub{margin-top:22px;font-size:29px;font-weight:400;line-height:1.4;color:var(--muted);max-width:880px}
/* One takeaway per page, on a lime bar. It is the only filled element, which is
   what makes it read as the conclusion rather than as decoration. */
.take{margin-top:auto;background:var(--accent);border-radius:14px;padding:30px 34px}
.take .k{font-size:23px;font-weight:600;letter-spacing:-.3px;opacity:.72}
.take .t{margin-top:10px;font-size:33px;font-weight:600;line-height:1.28;letter-spacing:-1.1px}
.plot{flex:1 1 auto;margin:44px 0 40px;display:flex;flex-direction:column;min-height:0}
.plot .axisrow{display:flex;align-items:baseline;justify-content:space-between;
  font-size:23px;font-weight:500;color:var(--muted);letter-spacing:-.3px}
.cols{flex:1 1 auto;display:flex;align-items:stretch;gap:26px;padding-top:26px;
  border-bottom:2px solid var(--ink);min-height:0;position:relative}
/* Gridlines behind the columns, so a height can actually be read off the page
   rather than guessed at. */
.cols::before{content:"";position:absolute;left:0;right:0;top:26px;bottom:0;
  background-image:repeating-linear-gradient(180deg,var(--rule) 0 1px,transparent 1px 76px)}
.col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;min-height:0}
.col .v{font-size:30px;font-weight:700;letter-spacing:-.9px;margin-bottom:14px}
.col .bar{width:82%;background:var(--ink);border-radius:6px 6px 0 0}
.col.hi .bar{background:var(--accent)}
.col.hi .v{background:var(--accent);border-radius:6px;padding:2px 10px}
.keys{display:flex;gap:26px;margin-top:20px}
.keys div{flex:1 1 0;text-align:center;font-size:24px;font-weight:500;line-height:1.24;letter-spacing:-.3px}
</style></head>
<body>
<div class="ground"></div>
<div class="page">
  <div class="head">
    <div class="lbl">{{sectionLabel}}</div>
    <div class="tools">{{iconSvg1}}{{iconSvg2}}{{iconSvg3}}{{iconSvg4}}</div>
  </div>
  <h2>{{title}} <em>{{titleAccent}}</em></h2>
  <p class="sub">{{subtitle}}</p>
  <div class="plot">
    <div class="axisrow"><span>{{chartYAxis}}</span><span>{{chartPeriod}}</span></div>
    <div class="cols">
      <div class="col"><div class="v">{{bar1V}}</div><div class="bar" style="height:{{bar1H}}%"></div></div>
      <div class="col"><div class="v">{{bar2V}}</div><div class="bar" style="height:{{bar2H}}%"></div></div>
      <div class="col"><div class="v">{{bar3V}}</div><div class="bar" style="height:{{bar3H}}%"></div></div>
      <div class="col hi"><div class="v">{{bar4V}}</div><div class="bar" style="height:{{bar4H}}%"></div></div>
      <div class="col"><div class="v">{{bar5V}}</div><div class="bar" style="height:{{bar5H}}%"></div></div>
    </div>
    <div class="keys">
      <div>{{bar1L}}</div><div>{{bar2L}}</div><div>{{bar3L}}</div><div>{{bar4L}}</div><div>{{bar5L}}</div>
    </div>
  </div>
  <div class="take"><div class="k">{{insightLabel}}</div><div class="t">{{insightText}}</div></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="37"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.42"/></svg>
</body></html>
