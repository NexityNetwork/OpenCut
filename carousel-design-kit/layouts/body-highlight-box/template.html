<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#F2F1EC;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(242,241,236,.58);--rule:rgba(242,241,236,.16);--accent:#F5E14B;--ink:#0C0C0C}
/* Flat near-black, no gradient. The family is named for the highlight, so the
   highlight is the system at two scales: a full-bleed band the statement sits
   inside, and solid marks on the words that carry the argument. Sixth dark
   family, and the only one whose structure runs horizontally across the frame. */
.ground{position:absolute;inset:0;z-index:0;background:#0C0C0C}
.grain{position:absolute;inset:0;z-index:6;opacity:.16;mix-blend-mode:overlay;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4}
.pad{padding:0 82px}
.band{background:#171717;padding:54px 82px}
mark{background:var(--accent);color:var(--ink);padding:0 12px;border-radius:5px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.top{padding:100px 82px 54px}
.head{display:flex;align-items:center;justify-content:space-between;gap:30px}
.head .lbl{font-size:27px;font-weight:500;color:var(--accent);letter-spacing:-.4px}
.head .tool{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:500}
.head .tool svg{width:38px;height:38px;display:block}
h2{margin-top:28px;font-size:70px;font-weight:700;line-height:1.04;letter-spacing:-2.9px}
.band{flex:0 0 auto}
.band .s{font-size:40px;font-weight:600;line-height:1.3;letter-spacing:-1.4px}
.facts{flex:1 1 auto;padding:18px 82px 88px;display:flex;flex-direction:column;justify-content:space-between}
.f{display:flex;gap:34px;padding:32px 0;border-bottom:1px solid var(--rule)}
.f:last-child{border-bottom:0}
.f .m{flex:0 0 210px;font-size:44px;font-weight:700;line-height:1.06;letter-spacing:-1.8px;color:var(--accent)}
.f .t{font-size:31px;font-weight:600;line-height:1.2;letter-spacing:-.9px}
.f .b{margin-top:12px;font-size:26px;font-weight:400;line-height:1.38;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<div class="page">
  <div class="top">
    <div class="head">
      <div class="lbl">{{categoryLabel}}</div>
      <div class="tool">{{iconSvg1}}<span>{{toolName}}</span></div>
    </div>
    <h2>{{titleLine1}}</h2>
  </div>
  <div class="band"><div class="s">{{statementLine1}} <mark>{{statementHighlight}}</mark></div></div>
  <div class="facts">
    <div class="f"><div class="m">{{fact1Metric}}</div><div><div class="t">{{fact1Title}}</div><div class="b">{{fact1Body}}</div></div></div>
    <div class="f"><div class="m">{{fact2Metric}}</div><div><div class="t">{{fact2Title}}</div><div class="b">{{fact2Body}}</div></div></div>
    <div class="f"><div class="m">{{fact3Metric}}</div><div><div class="t">{{fact3Title}}</div><div class="b">{{fact3Body}}</div></div></div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="23"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
