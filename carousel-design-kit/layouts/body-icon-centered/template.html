<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#F0EBE4;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(240,235,228,.58);--rule:rgba(240,235,228,.15);--accent:#E7DDCE}
/* Flat near-black, no glow. The fifth dark family needs its own drawn system:
   concentric rings struck from the centre of the page. The bodies put the tool
   in that centre, so the rings are the composition rather than decoration —
   which is what the original was reaching for with a blurred ember. */
.ground{position:absolute;inset:0;z-index:0;background:#0B0908}
.rings{position:absolute;left:50%;top:var(--ringY,50%);transform:translate(-50%,-50%);
  width:1900px;height:1900px;z-index:1;pointer-events:none;
  background:repeating-radial-gradient(circle,rgba(240,235,228,.085) 0 1px,transparent 1px 118px)}
.grain{position:absolute;inset:0;z-index:6;opacity:.16;mix-blend-mode:overlay;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:110px 84px 104px}
.head{display:flex;align-items:center;justify-content:space-between;gap:30px}
.head .lbl{font-size:27px;font-weight:500;color:var(--accent);letter-spacing:-.4px}
.head .name{font-size:27px;font-weight:600;letter-spacing:-.5px}
/* The tool sits at the centre the rings are struck from — the one place on the
   page where the ground and the subject agree. */
.mark{flex:0 0 auto;margin:56px auto 0;width:232px;height:232px;border-radius:50%;
  border:1px solid rgba(231,221,206,.42);background:#171310;
  display:flex;align-items:center;justify-content:center}
.mark svg{width:104px;height:104px;display:block}
h2{margin-top:52px;font-size:72px;font-weight:700;line-height:1.03;letter-spacing:-3px;text-align:center}
.body{margin-top:26px;font-size:31px;font-weight:400;line-height:1.44;color:rgba(240,235,228,.76);
  text-align:center;max-width:820px;margin-left:auto;margin-right:auto}
.body b{font-weight:600;color:#F0EBE4}
.figs{margin-top:auto;display:flex;padding-top:34px;border-top:1px solid var(--rule)}
.figs div{flex:1 1 0;text-align:center}
.figs .v{font-size:46px;font-weight:700;letter-spacing:-1.9px;line-height:1}
.figs .l{margin-top:10px;font-size:23px;font-weight:400;color:var(--muted);letter-spacing:-.3px}
.take{margin-top:34px;padding:28px 32px;border-radius:14px;background:var(--accent);color:#140F0B}
.take .k{font-size:23px;font-weight:600;opacity:.72;letter-spacing:-.3px}
.take .t{margin-top:9px;font-size:32px;font-weight:600;line-height:1.26;letter-spacing:-1.1px}
</style></head>
<body>
<div class="ground"></div>
<div class="rings" style="--ringY:31%"></div>
<div class="page">
  <div class="head">
    <div class="lbl">{{stepTag}}</div>
    <div class="name">{{toolName1}}</div>
  </div>
  <div class="mark">{{iconSvg1}}</div>
  <h2>{{title}}</h2>
  <p class="body">{{body}}</p>
  <div class="figs">
    <div><div class="v">{{stat1V}}</div><div class="l">{{stat1L}}</div></div>
    <div><div class="v">{{stat2V}}</div><div class="l">{{stat2L}}</div></div>
    <div><div class="v">{{stat3V}}</div><div class="l">{{stat3L}}</div></div>
  </div>
  <div class="take"><div class="k">{{insightLabel}}</div><div class="t">{{insightText}}</div></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="83"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
