<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#1B1B22;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(27,27,34,.58);--rule:rgba(27,27,34,.16);--accent:#2B3A67}
/* A soft gradient built from near neighbours rather than opposing hues: four
   stops within a narrow warm range, so it reads as paper catching light instead
   of as a wash. Grain over the top stops it banding on export. The drawing is
   contour work — offset curves in a single stroke weight, which is a drawn
   field rather than a shape dropped on the page. */
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 12% 8%,  #FDF8F1 0%, transparent 55%),
  radial-gradient(100% 80% at 88% 4%,  #F6EFE8 0%, transparent 50%),
  radial-gradient(130% 100% at 82% 92%,#EDE4DC 0%, transparent 58%),
  radial-gradient(110% 95% at 4% 96%,  #F7F1E9 0%, transparent 56%),
  #F4EDE4}
.draw{position:absolute;inset:0;z-index:1;pointer-events:none}
.grain{position:absolute;inset:0;z-index:6;opacity:.2;mix-blend-mode:multiply;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:104px 84px 96px}
.label{font-size:25px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
.serif{font-family:"Playfair Display",serif}
.page{justify-content:space-between}
h2{margin-top:24px;font-size:82px;font-weight:600;line-height:1.04;letter-spacing:-2.6px;max-width:860px}
h2 em{font-style:italic;color:var(--accent)}
.prose{margin-top:34px;max-width:800px}
.prose p{font-size:30px;font-weight:400;line-height:1.56;color:rgba(27,27,34,.78)}
.prose p + p{margin-top:22px}
.prose b{font-weight:600;color:#1B1B22}
/* The pulled line sits in the accent and on a rule, the way a printed essay
   marks the sentence it wants you to keep. */
.pull{padding-left:32px;border-left:3px solid var(--accent);font-size:40px;font-weight:600;
  line-height:1.24;letter-spacing:-1.4px;color:var(--accent);max-width:820px}
</style></head>
<body>
<div class="mesh"></div>
<svg class="draw" viewBox="0 0 1080 1350" fill="none">
  <path d="M-60 900 C 180 870.0 340 930.0 600 885.0 S 940 921.0 1140 889.5" stroke="rgba(43,58,103,.22)" stroke-width="1.6" fill="none"/>
  <path d="M-60 932 C 180 898.4 340 963.24 600 915.2 S 940 955.52 1140 920.24" stroke="rgba(43,58,103,.22)" stroke-width="1.6" fill="none"/>
  <path d="M-60 964 C 180 926.8 340 1005.48 600 945.4 S 940 990.04 1140 950.98" stroke="rgba(43,58,103,.22)" stroke-width="1.6" fill="none"/>
  <path d="M-60 996 C 180 955.2 340 1038.72 600 975.6 S 940 1024.56 1140 981.72" stroke="rgba(43,58,103,.22)" stroke-width="1.6" fill="none"/>
  <path d="M-60 1028 C 180 983.6 340 1071.96 600 1005.8 S 940 1059.08 1140 1012.46" stroke="rgba(43,58,103,.22)" stroke-width="1.6" fill="none"/>
  <path d="M-60 1060 C 180 1012.0 340 1105.2 600 1036.0 S 940 1093.6 1140 1043.2" stroke="rgba(43,58,103,.22)" stroke-width="1.6" fill="none"/>
  <path d="M-60 1092 C 180 1040.4 340 1138.44 600 1066.2 S 940 1128.12 1140 1073.94" stroke="rgba(43,58,103,.22)" stroke-width="1.6" fill="none"/>
  <path d="M-60 1124 C 180 1068.8 340 1180.68 600 1096.4 S 940 1162.64 1140 1104.68" stroke="rgba(43,58,103,.22)" stroke-width="1.6" fill="none"/>
</svg>
<div class="page">
  <div>
    <div class="label">{{sectionLabel}}</div>
    <h2 class="serif">{{titleLine1}} <em>{{titleAccent}}</em></h2>
    <div class="prose"><p>{{para1}}</p><p>{{para2}}</p></div>
  </div>
  <div class="pull">{{pullLine}}</div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.4"/></svg>
</body></html>
