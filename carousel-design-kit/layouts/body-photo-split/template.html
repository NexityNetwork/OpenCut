<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#12171B;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#12171B;--sand:#E3D6C2;--hair-on-ink:rgba(227,214,194,.24);--hair-on-sand:rgba(18,23,27,.22)}

/* Body pages narrow the ink field to 500 and widen the sand counter-field to
   580: the claim gets a short, monumental column, the argument gets a proper
   measure. Under the claim is the gauge — a ruled field standing for what
   could be known, and a solid sand block rising from the bottom edge for the
   part you actually hold. It is flex:1 and it bleeds to the page edge, so the
   ink column can never open a dead band and the height of the block changes
   page to page. */
.page{position:absolute;inset:0;display:flex;z-index:4}
.ink{flex:0 0 500px;background:var(--ink);color:var(--sand);
  padding:66px 52px 60px;display:flex;flex-direction:column;overflow:hidden}
.sand{flex:1;background:var(--sand);color:var(--ink);
  padding:62px 48px 58px;display:flex;flex-direction:column}

.kicker{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:400;letter-spacing:.02em;opacity:.7}
h2{font-family:"Space Grotesk",sans-serif;font-size:73px;font-weight:700;
  line-height:1.16;letter-spacing:-2.8px;margin-top:26px}
h2 span{display:block}
h2 .soft{opacity:.55}

.gauge{flex:1;position:relative;margin:36px -52px -60px;min-height:230px;
  border-top:1px solid var(--hair-on-ink)}
.gauge .field{position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,transparent 0 33px,rgba(227,214,194,.20) 33px 34px),
    repeating-linear-gradient(to right,transparent 0 33px,rgba(227,214,194,.13) 33px 34px);
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,1))}
.gauge .mark{position:absolute;left:0;right:0;bottom:{{knownPct}};height:3px;
  background:var(--sand);pointer-events:none}
/* The block meets the sand counter-field colour-to-colour at the split, so it
   carries the ink edge itself — the vertical division survives all the way
   down the page. */
.gauge .fill{position:absolute;left:0;right:0;bottom:0;height:{{knownPct}};
  background:var(--sand);color:var(--ink);padding:26px 52px 42px;overflow:hidden;
  border-right:4px solid var(--ink);
  display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.gauge .fill .lab{font-family:"IBM Plex Mono",monospace;font-size:24px;line-height:1.32;opacity:.62}
.gauge .fill .note{font-size:26px;line-height:1.4;font-weight:500;
  padding-top:20px;border-top:1px solid var(--hair-on-sand)}

.lede{font-size:29px;line-height:1.46;padding-bottom:32px}
.lede b{font-weight:600}
.rows{flex:1;display:flex;flex-direction:column}
.row{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;
  padding:20px 0;border-top:1px solid var(--hair-on-sand)}
.row .k{font-family:"IBM Plex Mono",monospace;font-size:24px;opacity:.6}
.row .v{font-size:26px;line-height:1.38;font-weight:500}
.pull{margin-top:30px;padding-top:26px;border-top:3px solid var(--ink);
  font-size:31px;line-height:1.3;font-weight:600;letter-spacing:-.6px}
.grain{position:absolute;inset:0;z-index:6;opacity:.13;mix-blend-mode:overlay;pointer-events:none}
</style></head>
<body>
<div class="page">
  <div class="ink">
    <div class="kicker">{{kicker}}</div>
    <h2><span>{{c1}}</span><span>{{c2}}</span><span class="soft">{{c3}}</span></h2>
    <div class="gauge">
      <div class="field"></div>
      <div class="mark"></div>
      <div class="fill">
        <div class="lab">{{gaugeLabel}}</div>
        <div class="note">{{aside}}</div>
      </div>
    </div>
  </div>
  <div class="sand">
    <div class="lede">{{lede}}</div>
    <div class="rows">
      <div class="row"><div class="k">{{r1k}}</div><div class="v">{{r1v}}</div></div>
      <div class="row"><div class="k">{{r2k}}</div><div class="v">{{r2v}}</div></div>
      <div class="row"><div class="k">{{r3k}}</div><div class="v">{{r3v}}</div></div>
    </div>
    <div class="pull">{{pull}}</div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="17"/>
<feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.45"/></svg>
</body></html>
