<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#F1EEFA;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(241,238,250,.58);--rule:rgba(241,238,250,.18);--accent:#C0AEFF}
/* Flat aubergine, no gradient and no glow. The drawing is orbit work: ellipses
   tilted off-axis and stroked, never filled — a mist family that earns the name
   through line density instead of a blur. The rings sit low so type stays clear
   of them. */
.ground{position:absolute;inset:0;z-index:0;background:#17122B}
.draw{position:absolute;inset:0;z-index:1;pointer-events:none}
.grain{position:absolute;inset:0;z-index:6;opacity:.15;mix-blend-mode:overlay;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:104px 82px 96px;
  justify-content:space-between}
.label{font-size:25px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
h2{margin-top:24px;font-size:78px;font-weight:700;line-height:1.02;letter-spacing:-3.2px;max-width:860px}
h2 em{font-style:normal;color:var(--accent)}
.copy{margin-top:28px;font-size:31px;font-weight:400;line-height:1.46;color:rgba(241,238,250,.78);max-width:840px}
.copy b{font-weight:600;color:#F1EEFA}
.pts{display:flex;flex-direction:column}
.pt{display:flex;gap:32px;padding:36px 0;border-top:1px solid var(--rule)}
.pt .k{flex:0 0 280px;font-size:30px;font-weight:600;letter-spacing:-.6px;color:var(--accent);line-height:1.2}
.pt .v{font-size:27px;font-weight:400;line-height:1.38;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<svg class="draw" viewBox="0 0 1080 1350" fill="none">
  <ellipse cx="1010" cy="236" rx="150" ry="51" transform="rotate(16 1010 236)" stroke="#C0AEFF" stroke-opacity="0.42" stroke-width="1.6" fill="none"/>
  <ellipse cx="1010" cy="236" rx="196" ry="67" transform="rotate(19 1010 236)" stroke="#C0AEFF" stroke-opacity="0.39" stroke-width="1.6" fill="none"/>
  <ellipse cx="1010" cy="236" rx="242" ry="82" transform="rotate(22 1010 236)" stroke="#C0AEFF" stroke-opacity="0.35" stroke-width="1.6" fill="none"/>
  <ellipse cx="1010" cy="236" rx="288" ry="98" transform="rotate(25 1010 236)" stroke="#C0AEFF" stroke-opacity="0.31" stroke-width="1.6" fill="none"/>
  <ellipse cx="1010" cy="236" rx="334" ry="114" transform="rotate(28 1010 236)" stroke="#C0AEFF" stroke-opacity="0.28" stroke-width="1.6" fill="none"/>
  <ellipse cx="1010" cy="236" rx="380" ry="129" transform="rotate(31 1010 236)" stroke="#C0AEFF" stroke-opacity="0.24" stroke-width="1.6" fill="none"/>
  <ellipse cx="1010" cy="236" rx="426" ry="145" transform="rotate(34 1010 236)" stroke="#C0AEFF" stroke-opacity="0.21" stroke-width="1.6" fill="none"/>
</svg>
<div class="page">
  <div>
    <div class="label">{{sectionLabel}}</div>
    <h2>{{titleLine1}} <em>{{titleAccent}}</em></h2>
    <p class="copy">{{body}}</p>
  </div>
  <div class="pts">
    <div class="pt"><div class="k">{{p1Title}}</div><div class="v">{{p1Body}}</div></div>
    <div class="pt"><div class="k">{{p2Title}}</div><div class="v">{{p2Body}}</div></div>
    <div class="pt"><div class="k">{{p3Title}}</div><div class="v">{{p3Body}}</div></div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="3" seed="91"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
