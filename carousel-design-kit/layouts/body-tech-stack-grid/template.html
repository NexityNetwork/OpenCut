<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0E1116;color:#EEF1F4;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(238,241,244,.56);--rule:rgba(238,241,244,.14);--accent:#D9C27E}
/* A taxonomy laid out as a table of cells. The rules between cells are the only
   structure on the page — no panels, no shadows, no icons. One cell per page is
   raised into the accent and that is the whole hierarchy. */
.page{position:absolute;inset:0;z-index:2;padding:110px 88px 100px;display:flex;flex-direction:column}
.label{font-size:26px;font-weight:600;color:var(--accent);letter-spacing:-.4px}
h2{margin-top:22px;font-size:72px;font-weight:700;line-height:1.02;letter-spacing:-3px;max-width:800px}
h2 em{font-style:normal;color:var(--accent)}
.copy{margin-top:26px;font-size:29px;font-weight:400;line-height:1.46;color:rgba(238,241,244,.76);max-width:830px}
.copy b{font-weight:600;color:#EEF1F4}
/* Six cells, three rows of two, tiling the rest of the frame. */
.tab{flex:1;margin-top:44px;display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cl{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:26px 30px;display:flex;flex-direction:column;justify-content:center}
.cl .t{font-size:29px;font-weight:600;letter-spacing:-.6px;line-height:1.2}
.cl .g{margin-top:12px;font-size:24px;font-weight:400;line-height:1.38;color:var(--muted)}
.cl.up{background:var(--accent);color:#0E1116}
.cl.up .g{color:rgba(14,17,22,.74)}
</style></head>
<body>
<div class="page">
  <div class="label">{{sectionLabel}}</div>
  <h2>{{titleLine1}} <em>{{titleAccent}}</em></h2>
  <p class="copy">{{body}}</p>
  <div class="tab">
    <div class="cl"><div class="t">{{c1}}</div><div class="g">{{g1}}</div></div>
    <div class="cl"><div class="t">{{c2}}</div><div class="g">{{g2}}</div></div>
    <div class="cl up"><div class="t">{{c3}}</div><div class="g">{{g3}}</div></div>
    <div class="cl"><div class="t">{{c4}}</div><div class="g">{{g4}}</div></div>
    <div class="cl"><div class="t">{{c5}}</div><div class="g">{{g5}}</div></div>
    <div class="cl"><div class="t">{{c6}}</div><div class="g">{{g6}}</div></div>
  </div>
</div>
</body></html>
