<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#08090A;color:#E6EDE8;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(230,237,232,.54);--rule:rgba(92,230,138,.22);--accent:#5CE68A}
/* Fine horizontal scan lines are the ground and the only texture on the page.
   No terminal chrome, no prompts, no monospace body copy — the reference is the
   surface of a phosphor display, not a picture of a shell. */
.scan{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    rgba(92,230,138,.085) 0px, rgba(92,230,138,.085) 1px, transparent 1px, transparent 3px)}
.page{position:absolute;inset:0;z-index:3;padding:114px 92px 104px;display:flex;flex-direction:column}
.label{font-size:26px;font-weight:600;color:var(--accent);letter-spacing:-.4px}
h2{margin-top:22px;font-size:74px;font-weight:700;line-height:1.02;letter-spacing:-3.1px;max-width:820px}
h2 em{font-style:normal;color:var(--accent)}
.copy{margin-top:26px;font-size:29px;font-weight:400;line-height:1.46;color:rgba(230,237,232,.76);max-width:840px}
.copy b{font-weight:600;color:#E6EDE8}
/* Wide registers rather than ruled rows: the bands run past the margins and
   alternate in tone, so the lower page is scanned by the same horizontal logic
   as the ground. One register is lit. */
.regs{flex:1;margin:48px -92px -104px;display:flex;flex-direction:column}
.reg{flex:1;display:flex;align-items:center;gap:34px;padding:0 92px}
.reg:nth-child(odd){background:rgba(92,230,138,.055)}
.reg .k{flex:0 0 288px;font-size:29px;font-weight:600;letter-spacing:-.6px;line-height:1.22;color:var(--accent)}
.reg .v{font-size:26px;font-weight:400;line-height:1.4;color:var(--muted);max-width:540px}
.reg.on{background:var(--accent);color:#08090A}
.reg.on .k{color:#08090A}
.reg.on .v{color:rgba(8,9,10,.76)}
</style></head>
<body>
<div class="scan"></div>
<div class="page">
  <div class="label">{{sectionLabel}}</div>
  <h2>{{titleLine1}} <em>{{titleAccent}}</em></h2>
  <p class="copy">{{body}}</p>
  <div class="regs">
    <div class="reg"><div class="k">{{k1}}</div><div class="v">{{v1}}</div></div>
    <div class="reg on"><div class="k">{{k2}}</div><div class="v">{{v2}}</div></div>
    <div class="reg"><div class="k">{{k3}}</div><div class="v">{{v3}}</div></div>
  </div>
</div>
</body></html>
