<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafafa;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.wash{position:absolute;left:-280px;bottom:-300px;width:1000px;height:1000px;border-radius:50%;
  background:radial-gradient(circle,rgba(52,87,213,.16) 0%,transparent 66%);filter:blur(24px)}
.eyebrow{position:absolute;top:196px;left:75px;font-size:26px;font-weight:600;color:#3457D5;letter-spacing:-.4px}
.title{position:absolute;top:262px;left:75px;right:75px;font-size:118px;font-weight:700;line-height:1.02;letter-spacing:-4px;color:#141414}
.title .accent{color:#3457d5}
.body{position:absolute;top:640px;left:75px;right:140px;font-family:"Inter",sans-serif;font-size:44px;font-weight:500;line-height:1.4;color:#4b5563}
.cta-row{position:absolute;bottom:85px;left:75px;right:75px;display:flex;justify-content:space-between;align-items:center}
.btn{font-size:30px;font-weight:600;color:#141414;letter-spacing:-.6px}
.mark{position:absolute;pointer-events:none}
.mark-lg{right:-120px;bottom:-110px;width:460px;height:460px}
.mark-sm{right:70px;top:118px;width:200px;height:200px}
</style></head>
<body><div class="wash"></div>
<svg class="mark mark-lg" viewBox="0 0 460 460" fill="none">
  <circle cx="230" cy="230" r="225" stroke="#3457D5" stroke-width="1.4" opacity=".22"/>
  <circle cx="230" cy="230" r="171" stroke="#3457D5" stroke-width="1.4" opacity=".30"/>
  <circle cx="230" cy="230" r="117" stroke="#3457D5" stroke-width="1.4" opacity=".40"/>
  <path d="M230 5 A225 225 0 0 1 455 230" stroke="#3457D5" stroke-width="3.4" opacity=".85"/>
  <path d="M113 230 A117 117 0 0 0 230 347" stroke="#3457D5" stroke-width="3.4" opacity=".85"/>
  <circle cx="230" cy="230" r="9" fill="#3457D5"/>
</svg><div class="eyebrow">{{eyebrow}}</div>
<div class="title">{{titleLine1}} <span class="accent">{{titleAccent}}</span></div>
<div class="body">{{body}}</div>
<div class="cta-row">
  <div class="btn">{{ctaLabel}}</div></div>
</body></html>
