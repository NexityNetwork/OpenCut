<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#E7ECF5;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(231,236,245,.58);--rule:rgba(231,236,245,.15);--accent:#F6A44C}
/* Flat ground, drawn structure — no gradient. Each dark family gets its own
   system: columns for the figures one, ruled lines for the editorial one, and
   a dot matrix here, which is the only one of the three that reads as a plane
   rather than a page. */
.ground{position:absolute;inset:0;z-index:0;background:#0B1220}
.dots{position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(rgba(231,236,245,.13) 1.4px,transparent 1.4px);
  background-size:54px 54px;background-position:84px 90px}
.grain{position:absolute;inset:0;z-index:6;opacity:.14;mix-blend-mode:overlay;pointer-events:none}
/* Bands, like the bodies. A vertical rail of figures beside the headline has
   to stretch three numbers down the whole page; a horizontal row does not. */
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4}
.band{padding:0 84px}
.a{flex:56;display:flex;flex-direction:column;padding-top:112px;padding-bottom:48px}
.eyebrow{font-size:28px;font-weight:500;color:var(--accent);letter-spacing:-.4px}
h1{margin-top:32px;font-size:126px;font-weight:700;line-height:.95;letter-spacing:-5.4px}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:auto;font-size:33px;font-weight:400;line-height:1.42;color:var(--muted);max-width:760px}
.b{flex:24;display:flex;align-items:center;gap:74px;border-top:1px solid var(--rule)}
.b .v{font-size:66px;font-weight:700;letter-spacing:-2.7px;line-height:1}
.b .l{margin-top:11px;font-size:24px;font-weight:400;color:var(--muted);letter-spacing:-.3px}
.c{flex:32;background:#141F33;border-top:3px solid var(--accent);padding:0 84px;
  display:flex;flex-direction:column;justify-content:center}
.c .line{font-size:52px;font-weight:600;line-height:1.18;letter-spacing:-2px;max-width:840px}
.c .dock{margin-top:44px;display:flex;align-items:center;gap:38px}
.c .dock svg{width:50px;height:50px;display:block}
</style></head>
<body>
<div class="ground"></div>
<div class="dots"></div>
<div class="page">
  <div class="band a">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{titleMain}} <em>{{titleAccent}}</em></h1>
    <p class="sub">{{subline}}</p>
  </div>
  <div class="band b">
    <div><div class="v">{{stat1V}}</div><div class="l">{{stat1L}}</div></div>
    <div><div class="v">{{stat2V}}</div><div class="l">{{stat2L}}</div></div>
    <div><div class="v">{{stat3V}}</div><div class="l">{{stat3L}}</div></div>
  </div>
  <div class="c">
    <div class="line">{{coverLine}}</div>
    <div class="dock">{{iconSvg1}}{{iconSvg2}}{{iconSvg3}}{{iconSvg4}}{{iconSvg5}}</div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="61"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
