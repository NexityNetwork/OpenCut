<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#F0EEFB;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(240,238,251,.72);--rule:rgba(240,238,251,.20);--accent:#A99BFF}
/* Four saturated stops that ARE the ground, with grain over the top so a rich
   gradient does not band on export. The drawn object is frosted glass with a
   real drop shadow, rotated off-axis — a spinoff gets its own object, not a
   recolour of somebody else's. */
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 14% 16%, #6A54E8 0%, transparent 56%),
  radial-gradient(100% 80% at 88% 6%,  #9C8AFF 0%, transparent 50%),
  radial-gradient(120% 95% at 78% 90%, #2E1F8C 0%, transparent 58%),
  radial-gradient(110% 90% at 4% 92%,  #120B38 0%, transparent 56%),
  #0F0A30}
.grain{position:absolute;inset:0;z-index:1;opacity:.28;mix-blend-mode:overlay;pointer-events:none}
.obj{position:absolute;z-index:2;pointer-events:none}
.sheet{position:absolute;inset:0;padding:118px 84px 104px;display:flex;flex-direction:column;
  justify-content:space-between;z-index:4}
.eyebrow{font-size:28px;font-weight:500;color:var(--accent);letter-spacing:-.4px}
h1{margin-top:30px;font-size:118px;font-weight:700;line-height:.96;letter-spacing:-5px;max-width:760px}
h1 em{font-style:normal;color:#D6CEFF}
.sub{margin-top:34px;font-size:32px;font-weight:400;line-height:1.42;color:var(--muted);max-width:600px}
.stats{display:flex;gap:70px;padding-top:36px;border-top:1px solid var(--rule)}
.stat .v{font-size:56px;font-weight:700;letter-spacing:-2.3px;line-height:1}
.stat .l{margin-top:10px;font-size:23px;font-weight:500;color:var(--muted);letter-spacing:-.3px}
.dock{margin-top:44px;display:flex;align-items:center;gap:34px}
.dock svg{width:46px;height:46px;display:block}
.obj{right:-176px;top:436px;width:560px;height:460px;transform:rotate(-6deg);opacity:1}
</style></head>
<body>
<div class="mesh"></div>
<svg class="obj" viewBox="0 0 520 520" fill="none">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <filter id="osh" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#0C0726" flood-opacity=".5"/>
    </filter>
  </defs>
  <g filter="url(#osh)">
    <circle cx="260" cy="260" r="196" fill="url(#og)" stroke="rgba(255,255,255,.34)" stroke-width="2"/>
    <g stroke="rgba(255,255,255,.52)" stroke-width="2.5" fill="rgba(255,255,255,.10)">
      <path d="M260 74 L406 158 L260 200 Z"/>
      <path d="M406 158 L406 326 L296 236 Z"/>
      <path d="M406 326 L260 410 L296 284 Z"/>
      <path d="M260 410 L114 326 L224 284 Z"/>
      <path d="M114 326 L114 158 L224 236 Z"/>
      <path d="M114 158 L260 74 L224 200 Z"/>
    </g>
    <circle cx="260" cy="260" r="44" stroke="rgba(255,255,255,.6)" stroke-width="2.5" fill="none"/>
  </g>
</svg>
<div class="sheet">
  <div>
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
  <p class="sub">{{subtitle}}</p>
  </div>
  <div>
  <div class="stats">
    <div class="stat"><div class="v">{{stat1V}}</div><div class="l">{{stat1L}}</div></div>
    <div class="stat"><div class="v">{{stat2V}}</div><div class="l">{{stat2L}}</div></div>
    <div class="stat"><div class="v">{{stat3V}}</div><div class="l">{{stat3L}}</div></div>
  </div>
  <div class="dock">{{iconSvg1}}{{iconSvg2}}{{iconSvg3}}{{iconSvg4}}{{iconSvg5}}</div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="12"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.55"/></svg>
</body></html>
