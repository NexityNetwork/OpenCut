<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#EDF3F7;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(237,243,247,.56);--rule:rgba(237,243,247,.15);--accent:#7FDBFF}
/* The name is the only good idea in the original: a light leak. Built as a
   hard-edged shaft rather than a blur — bands of light crossing the frame at an
   angle, with one bright edge. A blur is a glow; an edge is a shaft, and only
   one of those reads as drawn. Seventh dark family, seventh system. */
.ground{position:absolute;inset:0;z-index:0;background:#08090B}
/* The leak is confined to the right edge. Bands crossing the frame put light
   behind the type and made every page unreadable — a leak is light entering at
   an edge, not a pattern laid over the content. */
.leak{position:absolute;top:0;bottom:0;right:0;width:360px;z-index:1;pointer-events:none;
  background:linear-gradient(270deg,rgba(127,219,255,.17) 0%,rgba(127,219,255,.05) 46%,transparent 100%)}
.leak::after{content:"";position:absolute;top:0;bottom:0;right:0;width:2px;
  background:linear-gradient(180deg,transparent,rgba(200,242,255,.5) 30%,rgba(200,242,255,.5) 70%,transparent)}
.grain{position:absolute;inset:0;z-index:6;opacity:.16;mix-blend-mode:overlay;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:112px 84px 104px}
.page{justify-content:space-between}
.eyebrow{font-size:28px;font-weight:500;color:var(--accent);letter-spacing:-.4px}
h1{margin-top:30px;font-size:120px;font-weight:700;line-height:.95;letter-spacing:-5.1px;max-width:800px}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:34px;font-size:32px;font-weight:400;line-height:1.42;color:var(--muted);max-width:660px}
.mets{display:flex;gap:74px;padding-top:38px;border-top:1px solid var(--rule)}
.mets .v{font-size:58px;font-weight:700;letter-spacing:-2.4px;line-height:1}
.mets .l{margin-top:10px;font-size:23px;font-weight:500;color:var(--muted);letter-spacing:-.3px}
.dock{margin-top:44px;display:flex;align-items:center;gap:34px}
.dock svg{width:46px;height:46px;display:block}
</style></head>
<body>
<div class="ground"></div><div class="leak"></div>
<div class="page">
  <div>
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
    <p class="sub">{{subtitle}}</p>
  </div>
  <div>
    <div class="mets">
      <div><div class="v">{{meta1V}}</div><div class="l">{{meta1}}</div></div>
      <div><div class="v">{{meta2V}}</div><div class="l">{{meta2}}</div></div>
      <div><div class="v">{{meta3V}}</div><div class="l">{{meta3}}</div></div>
    </div>
    <div class="dock">{{iconSvg1}}{{iconSvg2}}{{iconSvg3}}{{iconSvg4}}{{iconSvg5}}</div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="31"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
