<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#F1EEFA;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(241,238,250,.58);--rule:rgba(241,238,250,.18);--accent:#C0AEFF}
/* Flat aubergine, no gradient and no glow. The drawing is orbit work: ellipses
   tilted off-axis and stroked, never filled — a mist family that earns the name
   through line density instead of a blur. The rings sit low so type stays clear
   of them. */
.ground{position:absolute;inset:0;z-index:0;background:#17122B}
.draw{position:absolute;inset:0;z-index:1;pointer-events:none}
.grain{position:absolute;inset:0;z-index:6;opacity:.15;mix-blend-mode:overlay;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:104px 82px 96px;
  justify-content:space-between}
.label{font-size:25px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
h1{margin-top:28px;font-size:112px;font-weight:700;line-height:.98;letter-spacing:-4.7px;max-width:860px}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:32px;font-size:32px;font-weight:400;line-height:1.44;color:var(--muted);max-width:700px}
.lines{display:flex;flex-direction:column}
.lines div{padding:20px 0;border-top:1px solid var(--rule);font-size:27px;font-weight:500;letter-spacing:-.5px}
.foot{margin-top:30px;padding-top:24px;border-top:1px solid var(--rule);font-size:24px;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<svg class="draw" viewBox="0 0 1080 1350" fill="none">
  <ellipse cx="700" cy="828" rx="150" ry="51" transform="rotate(-16 700 828)" stroke="#C0AEFF" stroke-opacity="0.42" stroke-width="1.6" fill="none"/>
  <ellipse cx="700" cy="828" rx="194" ry="66" transform="rotate(-13 700 828)" stroke="#C0AEFF" stroke-opacity="0.39" stroke-width="1.6" fill="none"/>
  <ellipse cx="700" cy="828" rx="238" ry="81" transform="rotate(-10 700 828)" stroke="#C0AEFF" stroke-opacity="0.35" stroke-width="1.6" fill="none"/>
  <ellipse cx="700" cy="828" rx="282" ry="96" transform="rotate(-7 700 828)" stroke="#C0AEFF" stroke-opacity="0.31" stroke-width="1.6" fill="none"/>
  <ellipse cx="700" cy="828" rx="326" ry="111" transform="rotate(-4 700 828)" stroke="#C0AEFF" stroke-opacity="0.28" stroke-width="1.6" fill="none"/>
  <ellipse cx="700" cy="828" rx="370" ry="126" transform="rotate(-1 700 828)" stroke="#C0AEFF" stroke-opacity="0.24" stroke-width="1.6" fill="none"/>
  <ellipse cx="700" cy="828" rx="414" ry="141" transform="rotate(2 700 828)" stroke="#C0AEFF" stroke-opacity="0.21" stroke-width="1.6" fill="none"/>
</svg>
<div class="page">
  <div>
    <div class="label">{{eyebrow}}</div>
    <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
    <p class="sub">{{subtitle}}</p>
  </div>
  <div>
    <div class="lines"><div>{{item1}}</div><div>{{item2}}</div></div>
    <div class="foot">{{coverNote}}</div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="3" seed="91"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
