<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FAFAF8;color:#111211;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(17,18,17,.56);--rule:rgba(17,18,17,.13);--accent:#E1251B}
/* Six columns of 130 with 24px gutters inside a 90px margin: 6x130 + 5x24 = 900.
   The column hairlines are drawn full-bleed and left visible, so the measure is
   the design and white space is ruled rather than empty. */
.grid{position:absolute;inset:0;z-index:1;pointer-events:none}
.page{position:absolute;inset:0;z-index:3;padding:112px 90px 104px;display:flex;flex-direction:column}
.eyebrow{font-size:25px;font-weight:500;color:var(--accent);letter-spacing:-.3px}
/* Flush left, four columns wide (90 -> 682): the title never runs the full
   measure, which is what makes the sixth column read as deliberate. */
h1{margin-top:26px;width:746px;font-size:124px;font-weight:700;line-height:.96;letter-spacing:-5.4px}
h1 em{font-style:normal;color:var(--accent)}
.bar{margin-top:40px;height:14px;background:var(--accent)}
.stand{margin-top:32px;width:746px;font-size:42px;font-weight:400;line-height:1.36;color:var(--muted)}
/* Three cells of two columns each close the measure. The note takes the third
   rather than hanging under them, so the foot of the page is one ruled row and
   not a row plus a leftover line. */
.cells{margin-top:auto;display:flex;align-items:stretch;gap:24px}
.cell{flex:0 0 284px;padding-top:24px;border-top:2px solid #111211}
.cell p{font-size:27px;font-weight:500;line-height:1.28;letter-spacing:-.5px}
.cell.note p{font-weight:400;color:var(--muted);font-size:24px;line-height:1.34}
</style></head>
<body>
<svg class="grid" viewBox="0 0 1080 1350" fill="none">
  <g stroke="rgba(17,18,17,.13)" stroke-width="1">
    <path d="M90 0 V1350 M244 0 V1350 M398 0 V1350 M552 0 V1350 M706 0 V1350 M860 0 V1350 M990 0 V1350"/>
  </g>
</svg>
<div class="page">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
  <div class="bar"></div>
  <p class="stand">{{standfirst}}</p>
  <div class="cells">
    <div class="cell"><p>{{item1}}</p></div>
    <div class="cell"><p>{{item2}}</p></div>
    <div class="cell note"><p>{{coverNote}}</p></div>
  </div>
</div>
</body></html>
