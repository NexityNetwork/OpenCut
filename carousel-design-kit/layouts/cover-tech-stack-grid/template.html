<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0E1116;color:#EEF1F4;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(238,241,244,.56);--rule:rgba(238,241,244,.14);--accent:#D9C27E}
/* A taxonomy laid out as a table of cells. The rules between cells are the only
   structure on the page — no panels, no shadows, no icons. One cell per page is
   raised into the accent and that is the whole hierarchy. */
.page{position:absolute;inset:0;z-index:2;padding:110px 88px 100px;display:flex;flex-direction:column}
.eyebrow{font-size:25px;font-weight:500;color:var(--accent);letter-spacing:-.3px}
h1{margin-top:26px;font-size:100px;font-weight:700;line-height:1;letter-spacing:-4.2px;max-width:820px}
h1 em{font-style:normal;color:var(--accent)}
.stand{margin-top:30px;font-size:33px;font-weight:400;line-height:1.4;color:var(--muted);max-width:800px}
/* Two by two, ruled on the inside only, stretched into whatever the copy leaves. */
.tab{flex:1;margin-top:48px;display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cl{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:32px 34px;display:flex;flex-direction:column;justify-content:center}
.cl .t{font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:1.2}
.cl .g{margin-top:14px;font-size:25px;font-weight:400;line-height:1.4;color:var(--muted)}
.cl.up{background:var(--accent);color:#0E1116}
.cl.up .g{color:rgba(14,17,22,.74)}
.foot{margin-top:32px;font-size:24px;color:var(--muted)}
</style></head>
<body>
<div class="page">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
  <p class="stand">{{standfirst}}</p>
  <div class="tab">
    <div class="cl"><div class="t">{{c1}}</div><div class="g">{{g1}}</div></div>
    <div class="cl up"><div class="t">{{c2}}</div><div class="g">{{g2}}</div></div>
    <div class="cl"><div class="t">{{c3}}</div><div class="g">{{g3}}</div></div>
    <div class="cl"><div class="t">{{c4}}</div><div class="g">{{g4}}</div></div>
  </div>
  <div class="foot">{{coverNote}}</div>
</div>
</body></html>
