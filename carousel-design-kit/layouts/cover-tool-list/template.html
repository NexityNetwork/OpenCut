<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#F4F4F2;color:#1B1D18;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(27,29,24,.58);--rule:rgba(27,29,24,.2);--accent:#4E5A2E}
/* Everything hangs off one line. The opening phrase of each entry sits out in
   the left margin in the accent and the rest is indented past it, separated by
   full-width hairlines. No boxes, no panels, no fills — the indent is the
   entire structure. */
.page{position:absolute;inset:0;z-index:2;padding:116px 92px 104px;display:flex;flex-direction:column}
.eyebrow{margin-left:264px;font-size:25px;font-weight:500;color:var(--accent);letter-spacing:-.3px}
h1{margin:26px 0 0 264px;font-size:104px;font-weight:700;line-height:1;letter-spacing:-4.4px}
.stand{margin:32px 0 0 264px;font-size:34px;font-weight:400;line-height:1.4;color:var(--muted);max-width:632px}
.list{flex:1;margin-top:56px;display:flex;flex-direction:column;border-bottom:1px solid var(--rule)}
.en{flex:1;display:flex;gap:32px;align-items:center;padding:22px 0;border-top:1px solid var(--rule)}
.en .h{flex:0 0 232px;font-size:29px;font-weight:600;color:var(--accent);letter-spacing:-.6px;line-height:1.22}
.en .b{font-size:31px;font-weight:500;letter-spacing:-.7px;line-height:1.3;max-width:600px}
.en.q .b{font-size:25px;font-weight:400;color:var(--muted);letter-spacing:-.2px}
.en.q .h{font-weight:500;color:var(--muted)}
</style></head>
<body>
<div class="page">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{titleLine1}}</h1>
  <p class="stand">{{standfirst}}</p>
  <div class="list">
    <div class="en"><div class="h">{{h1}}</div><div class="b">{{item1}}</div></div>
    <div class="en"><div class="h">{{h2}}</div><div class="b">{{item2}}</div></div>
    <div class="en q"><div class="h">{{h3}}</div><div class="b">{{coverNote}}</div></div>
  </div>
</div>
</body></html>
