<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FFFFFF;color:#000000;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(0,0,0,.5);--rule:rgba(0,0,0,.22)}
/* A specimen sheet. One enormous phrase per page against small technical
   annotations set on hairlines. Black on white and nothing else — the scale
   contrast between the two sizes is the entire design, so no colour, no rules
   heavier than a hairline, and no third weight. */
.page{position:absolute;inset:0;z-index:2;padding:104px 84px 96px;display:flex;flex-direction:column}
.ann{display:flex;gap:28px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.ann div{font-size:22px;font-weight:500;letter-spacing:-.2px;color:var(--muted)}
.ann div:first-child{color:#000;flex:0 0 300px}
.spec{flex:1;display:flex;align-items:center;padding:24px 0}
.spec h1{font-size:196px;font-weight:800;line-height:.95;letter-spacing:-9px}
.spec h1 span{font-weight:400;letter-spacing:-7px}
.foot{border-top:1px solid var(--rule);padding-top:24px;display:flex;gap:28px}
.foot .c{flex:1}
.foot .c .t{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.24}
.foot .c .g{margin-top:10px;font-size:22px;font-weight:400;line-height:1.36;color:var(--muted)}
.note{margin-top:24px;padding-top:18px;border-top:1px solid var(--rule);font-size:22px;color:var(--muted)}
</style></head>
<body>
<div class="page">
  <div class="ann"><div>{{eyebrow}}</div><div>{{annotation}}</div></div>
  <div class="spec"><h1>{{titleLine1}} <span>{{titleAccent}}</span></h1></div>
  <div class="foot">
    <div class="c"><div class="t">{{c1}}</div><div class="g">{{item1}}</div></div>
    <div class="c"><div class="t">{{c2}}</div><div class="g">{{item2}}</div></div>
  </div>
  <div class="note">{{coverNote}}</div>
</div>
</body></html>
