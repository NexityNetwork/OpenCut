<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0B0B0C;color:#FAFAF9;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(250,250,249,.78);--faint:rgba(250,250,249,.56);--rule:rgba(250,250,249,.16)}
.sheet{position:absolute;inset:0;padding:64px 76px 68px;display:flex;flex-direction:column}
/* Headline sits low, just above the stack, so the slack reads as one
   deliberate field at the top rather than a hole in the middle. */
.head{margin-top:auto}
h1{font-size:108px;font-weight:600;line-height:1.02;letter-spacing:-.045em;max-width:900px}
h1 .two{display:block;color:var(--faint)}
.body{margin-top:36px;font-size:32px;font-weight:400;line-height:1.48;color:var(--muted);max-width:720px}
.stack{margin-top:64px;padding-top:34px;border-top:1px solid var(--rule)}
.stack .k{font-size:21px;font-weight:500;color:var(--faint)}
.grid{margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:40px;column-gap:30px}
.c{display:flex;align-items:center;gap:14px}
.c i{display:block;width:32px;height:32px;flex:0 0 auto}
.c i svg{width:100%;height:100%;display:block}
.c em{font-style:normal;font-size:24px;font-weight:500;letter-spacing:-.018em;color:rgba(250,250,249,.82)}
.cue{margin-top:44px;padding-top:26px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.cue .l{font-size:30px;font-weight:600;letter-spacing:-.022em}
.cue .r{font-size:23px;font-weight:400;color:var(--muted)}
</style></head>
<body>
<div class="sheet">
  <div class="head">
  <h1>{{ctaHeadline1}}<span class="two">{{ctaHeadline2}}</span></h1>
  <p class="body">{{ctaBody}}</p>
  </div>
  <div class="stack">
    <div class="k">The full stack</div>
    <div class="grid">
      <div class="c"><i>{{iconSvg1}}</i><em>{{toolName1}}</em></div>
      <div class="c"><i>{{iconSvg2}}</i><em>{{toolName2}}</em></div>
      <div class="c"><i>{{iconSvg3}}</i><em>{{toolName3}}</em></div>
      <div class="c"><i>{{iconSvg4}}</i><em>{{toolName4}}</em></div>
      <div class="c"><i>{{iconSvg5}}</i><em>{{toolName5}}</em></div>
      <div class="c"><i>{{iconSvg6}}</i><em>{{toolName6}}</em></div>
      <div class="c"><i>{{iconSvg7}}</i><em>{{toolName7}}</em></div>
      <div class="c"><i>{{iconSvg8}}</i><em>{{toolName8}}</em></div>
    </div>
  </div>
  <div class="cue"><div class="l">{{freeBadge}}</div><div class="r">{{eyebrow}}</div></div>
</div>
</body></html>
