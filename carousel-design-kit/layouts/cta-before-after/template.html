<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#F7F5F2;color:#16161A;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
/* Two-tone comparison palette: clay for the old way, green for the new one.
   Colour is spent only where the slide is actually making a comparison. */
:root{--ink:#16161A;--muted:#63636B;--faint:#93939C;--rule:rgba(22,22,26,.14);
      --before:#B4462A;--beforeBg:rgba(180,70,42,.06);--beforeRule:rgba(180,70,42,.24);
      --after:#1B7A55;--afterBg:rgba(27,122,85,.06);--afterRule:rgba(27,122,85,.24)}
.sheet{position:absolute;inset:0;padding:76px 76px 72px;display:flex;flex-direction:column}
h1,h2{font-weight:600;letter-spacing:-.042em;line-height:1.02}
.accent{color:var(--after)}
.desc{font-size:31px;font-weight:400;line-height:1.42;color:var(--muted)}
.pane{border-radius:14px;padding:34px 36px}
.pane .lab{font-size:21px;font-weight:600;letter-spacing:-.01em}
.pane .txt{margin-top:14px;font-size:28px;font-weight:400;line-height:1.38;color:var(--ink)}
.pane .stat{margin-top:22px;font-size:34px;font-weight:600;letter-spacing:-.03em}
.marks{display:flex;align-items:center;gap:20px}
.marks span{width:30px;height:30px}
.marks span svg{width:100%;height:100%;display:block}
.eyebrow{font-size:22px;font-weight:500;color:var(--faint);letter-spacing:-.01em}
h1{margin-top:auto;font-size:116px;max-width:900px}
.desc{margin-top:34px;max-width:760px}
.stack{margin-top:56px;padding-top:32px;border-top:1px solid var(--rule)}
.stack .k{font-size:21px;font-weight:500;color:var(--faint)}
.grid{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);row-gap:34px;column-gap:30px}
.c{display:flex;align-items:center;gap:16px}
.c i{display:block;width:32px;height:32px;flex:0 0 auto}
.c i svg{width:100%;height:100%;display:block}
.c em{font-style:normal;font-size:25px;font-weight:500;letter-spacing:-.02em}
.cue{margin-top:52px;padding-top:30px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:16px}
.cue .l{font-size:32px;font-weight:600;letter-spacing:-.028em;color:var(--after)}
h1 .accent{font-family:"Fraunces",serif;font-style:italic;font-weight:600;letter-spacing:-.02em}
</style></head>
<body>
<div class="sheet">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{headlineLine1}} <span class="accent">{{headlineAccent}}</span></h1>
  <p class="desc">{{body}}</p>
  <div class="stack">
    <div class="k">The stack</div>
    <div class="grid">
      <div class="c"><i>{{iconSvg1}}</i><em>{{toolName1}}</em></div>
      <div class="c"><i>{{iconSvg2}}</i><em>{{toolName2}}</em></div>
      <div class="c"><i>{{iconSvg3}}</i><em>{{toolName3}}</em></div>
      <div class="c"><i>{{iconSvg4}}</i><em>{{toolName4}}</em></div>
      <div class="c"><i>{{iconSvg5}}</i><em>{{toolName5}}</em></div>
      <div class="c"><i>{{iconSvg6}}</i><em>{{toolName6}}</em></div>
    </div>
  </div>
  <div class="cue">
    <div class="l">{{ctaText}}</div>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B7A55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
  </div>
</div>
</body></html>
