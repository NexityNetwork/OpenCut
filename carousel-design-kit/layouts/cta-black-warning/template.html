<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.wash{position:absolute;right:-260px;top:-240px;width:960px;height:960px;border-radius:50%;background:radial-gradient(circle,rgba(52,87,213,.16) 0%,transparent 66%);filter:blur(24px)}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FAFAFA;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.center{position:absolute;top:50%;left:75px;right:75px;transform:translateY(-50%);text-align:center}
.eyebrow{display:inline-block;padding:12px 28px;background:#3457d5;color:#fff;border-radius:50px;font-family:"Geist",sans-serif;font-size:22px;font-weight:600;letter-spacing:0.08em;margin-bottom:36px;}
.headline{font-size:112px;font-weight:700;line-height:1.0;letter-spacing:-3px;margin-bottom:36px}
.headline .accent{color:#3457d5}
.body{font-size:36px;font-weight:500;line-height:1.4;color:#4b5563;max-width:840px;margin:0 auto 56px}
.btn{display:inline-flex;align-items:center;gap:14px;padding:24px 48px;background:#3457d5;color:#fff;border-radius:50px;font-size:28px;font-weight:600}
.save{position:absolute;bottom:85px;right:75px;width:54px;height:54px;background:#3457d5;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.mark{position:absolute;pointer-events:none}
.mark-lg{right:-120px;bottom:-110px;width:460px;height:460px}
.mark-sm{right:70px;top:118px;width:200px;height:200px}
</style></head>
<body><div class="wash"></div>
<svg class="mark mark-lg" viewBox="0 0 460 460" fill="none">
  <circle cx="230" cy="230" r="225" stroke="#3457D5" stroke-width="1.4" opacity=".22"/>
  <circle cx="230" cy="230" r="171" stroke="#3457D5" stroke-width="1.4" opacity=".30"/>
  <circle cx="230" cy="230" r="117" stroke="#3457D5" stroke-width="1.4" opacity=".40"/>
  <path d="M230 5 A225 225 0 0 1 455 230" stroke="#3457D5" stroke-width="3.4" opacity=".85"/>
  <path d="M113 230 A117 117 0 0 0 230 347" stroke="#3457D5" stroke-width="3.4" opacity=".85"/>
  <circle cx="230" cy="230" r="9" fill="#3457D5"/>
</svg><div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineAccent}}</span></div>
  <div class="body">{{body}}</div>
  <div class="btn">{{buttonLabel}} </div>
</div>
<div class="save">🔖</div>
</body></html>
