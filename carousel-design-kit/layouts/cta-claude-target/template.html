<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#F7F2EC;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#F7F2EC;--muted:rgba(247,242,236,.70);--rule:rgba(247,242,236,.16);--orange:#F2733F}
/* A real mesh: four saturated radial stops that ARE the ground, not faint
   blobs sitting on a flat fill. That was why the old ones read muddy. */
.mesh{position:absolute;inset:0;z-index:0}
.mesh.dark{background:
  radial-gradient(120% 90% at 16% 18%, #C4522A 0%, transparent 55%),
  radial-gradient(100% 80% at 86% 8%,  #F2733F 0%, transparent 50%),
  radial-gradient(120% 95% at 74% 86%, #8A3418 0%, transparent 58%),
  radial-gradient(110% 90% at 6% 92%,  #4A1B0C 0%, transparent 55%),
  #16110D}
.mesh.light{background:
  radial-gradient(120% 90% at 18% 16%, #FFB489 0%, transparent 55%),
  radial-gradient(100% 80% at 84% 10%, #FFE0CB 0%, transparent 52%),
  radial-gradient(120% 95% at 72% 88%, #FF9256 0%, transparent 56%),
  radial-gradient(110% 90% at 8% 90%,  #FFF1E6 0%, transparent 54%),
  #FBF4EE}
/* Grain keeps the large colour fields from banding on export. */
.grain{position:absolute;inset:0;z-index:1;opacity:.30;mix-blend-mode:overlay;pointer-events:none}
.sheet{position:absolute;inset:0;padding:104px 84px 96px;display:flex;flex-direction:column;justify-content:center;z-index:4}
html,body{color:#2A1509}
:root{--muted:rgba(42,21,9,.72);--rule:rgba(42,21,9,.20)}
.obj{position:absolute;z-index:2;pointer-events:none}
.obj-folder{right:-80px;bottom:-40px;width:480px;height:380px;transform:rotate(6deg)}
.eyebrow{font-size:27px;font-weight:600;color:#B4451F}
h1{margin-top:22px;font-size:102px;font-weight:700;line-height:1.0;letter-spacing:-4px;max-width:820px}
h1 em{font-style:normal;color:#B4451F}
.body{margin-top:36px;font-size:32px;font-weight:400;line-height:1.44;color:var(--muted);max-width:680px}
.btn{margin-top:54px;align-self:flex-start;padding:22px 44px;background:#2A1509;color:#FFF1E6;
  border-radius:14px;font-size:29px;font-weight:600;letter-spacing:-.5px}
</style></head>
<body>
<div class="mesh light"></div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="9"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.55"/></svg>
<svg class="obj obj-folder" viewBox="0 0 560 440" fill="none">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".10"/>
    </linearGradient>
    <filter id="fsh" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#2A0E04" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#fsh)">
    <path d="M24 96C24 74 42 56 64 56h150c10 0 19 4 26 12l22 24h274c22 0 40 18 40 40v268c0 22-18 40-40 40H64c-22 0-40-18-40-40z"
          fill="url(#fg)" stroke="rgba(255,255,255,.42)" stroke-width="2"/>
    <path d="M24 168h512" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
  </g>
</svg>
<div class="sheet">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{headlineMain}} <em>{{headlineAccent}}</em></h1>
  <p class="body">{{body}}</p>
  <div class="btn">{{buttonLine}}</div>
</div>
</body></html>
