<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#14110D;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
/* Warm paper and ink. The pill is the only solid mass on the page. */
:root{--ink:#14110D;--muted:rgba(20,17,13,.68);--rule:rgba(20,17,13,.16)}
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 14% 14%, #F4E3CE 0%, transparent 56%),
  radial-gradient(100% 80% at 88% 8%,  #FBF1E4 0%, transparent 52%),
  radial-gradient(120% 95% at 78% 90%, #E8D2B4 0%, transparent 58%),
  radial-gradient(110% 90% at 6% 92%,  #FDF8F1 0%, transparent 54%),
  #F6EFE5}
.mesh.ink{background:
  radial-gradient(120% 90% at 16% 16%, #2E2820 0%, transparent 56%),
  radial-gradient(100% 80% at 86% 10%, #4A4133 0%, transparent 52%),
  radial-gradient(120% 95% at 76% 88%, #1A1712 0%, transparent 58%),
  radial-gradient(110% 90% at 8% 90%,  #241F19 0%, transparent 54%),
  #191510}
.grain{position:absolute;inset:0;z-index:1;opacity:.32;mix-blend-mode:overlay;pointer-events:none}
.obj{position:absolute;z-index:2;pointer-events:none}
.sheet{position:absolute;inset:0;padding:124px 88px 108px;display:flex;flex-direction:column;justify-content:space-between;z-index:4}
/* The family's signature: a solid ink slab holding one word. Kept, but set
   in sentence case at a readable weight instead of condensed all-caps. */
.pill{display:inline-block;align-self:flex-start;padding:20px 40px 24px;background:var(--ink);color:#F6EFE5;
  border-radius:18px;font-size:88px;font-weight:700;letter-spacing:-3.4px;line-height:1}
html,body{color:#F6EFE5}
:root{--ink:#F6EFE5;--muted:rgba(246,239,229,.70);--rule:rgba(246,239,229,.20)}
.obj-clock{right:-90px;top:510px;width:440px;height:440px;transform:rotate(6deg);opacity:.55}
.obj-clock circle,.obj-clock path{stroke:rgba(246,239,229,.5)}
.eyebrow{font-size:28px;font-weight:600;color:var(--muted)}
.pill{margin-top:18px;background:#F6EFE5;color:#191510}
.body{margin-top:0;font-size:33px;font-weight:400;line-height:1.44;color:var(--muted);max-width:700px}
.tools{padding-top:32px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:34px}
.tools .t{display:flex;align-items:center;gap:12px}
.tools .t i{display:block;width:30px;height:30px;flex:0 0 auto}
.tools .t i svg{width:100%;height:100%;display:block}
.tools .t em{font-style:normal;font-size:24px;font-weight:500;color:var(--muted);letter-spacing:-.3px}
.btn{margin-top:40px;align-self:flex-start;padding:22px 44px;background:#F6EFE5;color:#191510;
  border-radius:14px;font-size:29px;font-weight:600;letter-spacing:-.5px}
</style></head>
<body>
<div class="mesh ink"></div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="5"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.55"/></svg>
<svg class="obj obj-clock" viewBox="0 0 460 460" fill="none">
  <defs>
    <filter id="csh" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#5A4630" flood-opacity=".28"/>
    </filter>
  </defs>
  <g filter="url(#csh)">
    <circle cx="230" cy="230" r="196" fill="rgba(20,17,13,.07)" stroke="rgba(20,17,13,.30)" stroke-width="2"/>
    <circle cx="230" cy="230" r="140" stroke="rgba(20,17,13,.20)" stroke-width="2"/>
    <path d="M230 230 L230 116" stroke="rgba(20,17,13,.60)" stroke-width="9" stroke-linecap="round"/>
    <path d="M230 230 L318 274" stroke="rgba(20,17,13,.60)" stroke-width="9" stroke-linecap="round"/>
    <path d="M230 34 A196 196 0 0 1 426 230" stroke="rgba(20,17,13,.62)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="230" cy="230" r="12" fill="rgba(20,17,13,.72)"/>
  </g>
</svg>
<div class="sheet">
  <div class="head"><div class="eyebrow">{{eyebrow}}</div>
  <div class="pill">{{headline}}</div></div>
  <p class="body">{{body}}</p>
  <div class="tools">
    <div class="t"><i>{{iconSvg1}}</i><em>{{toolName1}}</em></div>
    <div class="t"><i>{{iconSvg2}}</i><em>{{toolName2}}</em></div>
    <div class="t"><i>{{iconSvg3}}</i><em>{{toolName3}}</em></div>
  </div>
  <div class="btn">{{buttonLabel}}</div>
</div>
</body></html>
