<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#0F1A14;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ink:#0F1A14;--muted:rgba(15,26,20,.68);--rule:rgba(15,26,20,.16);--green:#1F9D5B}
.grain{position:absolute;inset:0;z-index:5;opacity:.26;mix-blend-mode:multiply;pointer-events:none}
.mesh-green{background:
  radial-gradient(120% 90% at 16% 14%, #2FBF74 0%, transparent 56%),
  radial-gradient(100% 80% at 88% 6%,  #7BE3A8 0%, transparent 52%),
  radial-gradient(120% 95% at 78% 92%, #0E6E3E 0%, transparent 58%),
  radial-gradient(110% 90% at 4% 94%,  #063A20 0%, transparent 56%),
  #0B3F25}
.mesh-cream{background:
  radial-gradient(120% 90% at 14% 16%, #E4F3E9 0%, transparent 56%),
  radial-gradient(100% 80% at 88% 8%,  #FAFDF9 0%, transparent 52%),
  radial-gradient(120% 95% at 78% 92%, #D3EADC 0%, transparent 58%),
  radial-gradient(110% 90% at 4% 92%,  #FFFFFF 0%, transparent 54%),
  #EEF6F0}
.bg{position:absolute;inset:0;z-index:0}
/* Mirror of the body split — the band sits at the foot this time. */
.band{position:absolute;left:0;right:0;bottom:0;height:420px;z-index:1;color:#EAFBF1}
.band .inner{position:absolute;inset:0;padding:72px 88px;display:flex;flex-direction:column;justify-content:space-between}
.band .k{font-size:26px;font-weight:600;color:rgba(234,251,241,.76)}
.band .btn{align-self:flex-start;padding:22px 44px;background:#EAFBF1;color:#0B3F25;border-radius:14px;
  font-size:29px;font-weight:600;letter-spacing:-.5px}
.sheet{position:absolute;left:0;right:0;top:0;height:930px;padding:130px 88px 60px;
  display:flex;flex-direction:column;justify-content:space-between;z-index:2}
h1{font-size:108px;font-weight:600;line-height:1.0;letter-spacing:-4.2px;max-width:800px}
h1 b{font-weight:700;color:var(--green)}
.sub{font-size:33px;font-weight:400;line-height:1.42;color:var(--muted);max-width:640px}
</style></head>
<body>
<div class="bg mesh-cream"></div>
<div class="sheet">
  <h1>{{ctaQuestion}} <b>{{ctaBold}}</b></h1>
  <p class="sub">{{tagline}}</p>
</div>
<div class="band mesh-green"><div class="inner">
  <div class="k">{{eyebrow}}</div>
  <div class="btn">{{buttonLabel}}</div>
</div></div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="31"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
