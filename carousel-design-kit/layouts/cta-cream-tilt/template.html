<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#FFF6EC;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(255,246,236,.8);--rule:rgba(255,246,236,.26)}
/* Ember rather than near-black: this family opens on cream and closes on the
   accent, so the two ends read as one gesture instead of a light and a dark. */
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(100% 78% at 82% 6%,  #F2A265 0%, transparent 46%),
  radial-gradient(120% 92% at 14% 22%, #D1602C 0%, transparent 52%),
  radial-gradient(130% 100% at 72% 96%,#7E3211 0%, transparent 58%),
  radial-gradient(110% 95% at 4% 98%,  #5A2109 0%, transparent 56%),
  #A8471D}
.grain{position:absolute;inset:0;z-index:5;opacity:.3;mix-blend-mode:overlay;pointer-events:none}
.tile{border-radius:26%;background:#FFFCF7;display:flex;align-items:center;justify-content:center;
  box-shadow:0 22px 38px -16px rgba(40,14,2,.5), inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid rgba(22,19,14,.08)}
.tile svg{width:56%;height:56%;display:block}
.sheet{position:absolute;inset:0;padding:118px 84px 112px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;z-index:4}
h1{font-size:124px;font-weight:700;line-height:.96;letter-spacing:-5.2px;max-width:900px}
h1 em{font-style:normal;color:#3A1608}
.sub{margin-top:34px;font-size:33px;font-weight:400;line-height:1.4;color:var(--muted);max-width:700px}
.dock{margin-top:76px;display:flex;align-items:center;justify-content:center;gap:22px}
.dock .tile{width:112px;height:112px}
.btn{margin-top:76px;padding:24px 50px;background:#FFF6EC;color:#5A2109;border-radius:15px;
  font-size:29px;font-weight:600;letter-spacing:-.5px}
.ghost{margin-top:24px;font-size:25px;font-weight:500;color:var(--muted)}
</style></head>
<body>
<div class="mesh"></div>
<div class="sheet">
  <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
  <p class="sub">{{body}}</p>
  <div class="dock">
    <div class="tile">{{iconSvg1}}</div><div class="tile">{{iconSvg2}}</div>
    <div class="tile">{{iconSvg3}}</div><div class="tile">{{iconSvg4}}</div>
    <div class="tile">{{iconSvg5}}</div>
  </div>
  <div class="btn">{{btnPrimary}}</div>
  <div class="ghost">{{signoff}}</div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="71"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
