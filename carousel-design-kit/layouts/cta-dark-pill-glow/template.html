<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#EAEDF5;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(234,237,245,.6);--rule:rgba(234,237,245,.14);--accent:#6EA8FF}
/* The glow is gone — it was a blur standing in for a shape. What survives from
   the family is the container: content lives in solid panels. The page is a
   mosaic of them, which is also why it can never open a gap; the panels tile
   the frame and the gutters between them are the only space by design. */
.ground{position:absolute;inset:0;z-index:0;background:#0A0C12}
.grain{position:absolute;inset:0;z-index:6;opacity:.14;mix-blend-mode:overlay;pointer-events:none}
.mosaic{position:absolute;inset:44px;z-index:4;display:flex;flex-direction:column;gap:14px}
.p{background:#141824;border-radius:22px;padding:52px 54px;display:flex;flex-direction:column;justify-content:center}
.p.accent{background:var(--accent);color:#08101F}
.p.pale{background:#1C2233}
.row{display:flex;gap:14px}
.a{flex:46;background:var(--accent);color:#08101F}
.a .eyebrow{font-size:27px;font-weight:500;opacity:.72;letter-spacing:-.4px}
/* Italic on the flooded panel: the accent colour cannot mark the second
   phrase when the panel is already the accent, so the cut does it. */
.a h1 em{font-style:italic}
.a h1{margin-top:28px;font-size:112px;font-weight:700;line-height:.95;letter-spacing:-4.8px}
.a .sub{margin-top:32px;font-size:32px;font-weight:400;line-height:1.4;opacity:.78}
.b{flex:28}
.b .t{font-size:48px;font-weight:600;line-height:1.2;letter-spacing:-1.9px}
.c{flex:26;gap:14px;align-items:stretch}
.c .btn{flex:1 1 0;background:#EAEDF5;color:#0A0C12;border-radius:22px;
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600;letter-spacing:-.7px}
.c .note{flex:1 1 0}
.c .note .k{font-size:25px;font-weight:400;line-height:1.34;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<div class="mosaic">
  <div class="p a">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{headlineMain}} <em>{{headlineAccent}}</em></h1>
    <p class="sub">{{subline}}</p>
  </div>
  <div class="p pale b"><div class="t">{{heroTitle}}</div></div>
  <div class="row c">
    <div class="btn">{{buttonLabel}}</div>
    <div class="p pale note"><div class="k">{{signoff}}</div></div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="17"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
