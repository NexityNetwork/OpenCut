<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#14161A;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(20,22,26,.58);--rule:rgba(20,22,26,.13);--track:#E6E4DE;--accent:#1F4BD8}
/* Flat paper, no gradient. The structure here is the chart itself: the family
   is the only one in the set that is led by a measurement, so the drawn system
   is an axis — gridlines the bars are read against, not texture behind them. */
.ground{position:absolute;inset:0;z-index:0;background:#F7F6F2}
.grain{position:absolute;inset:0;z-index:6;opacity:.2;mix-blend-mode:multiply;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:112px 84px 104px}
/* Rows stretch to fill their band, so a chart of three bars and a chart of
   five both occupy the page exactly. */
.chart{flex:1 1 auto;display:flex;flex-direction:column;position:relative}
.chart .axis{position:absolute;top:0;bottom:0;left:322px;right:194px;pointer-events:none;
  background-image:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 149px)}
.row{flex:1 1 0;display:flex;align-items:center;gap:26px;min-height:0}
.row .k{flex:0 0 296px;font-size:29px;font-weight:500;line-height:1.22;letter-spacing:-.5px}
.row .track{flex:1 1 auto;height:52px;background:var(--track);border-radius:4px;position:relative}
.row .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.row.mute .fill{background:#B9BDC7}
/* The value gets its own column at the axis end. Hung off the end of the bar
   it ran straight off the frame as soon as a bar passed about eighty per cent. */
.row .v{flex:0 0 168px;text-align:right;font-size:30px;font-weight:600;
  letter-spacing:-.6px;line-height:1.16}
.ground{background:#14161A}
html,body{color:#F7F6F2}
:root{--muted:rgba(247,246,242,.62);--rule:rgba(247,246,242,.18);--track:#2A2E36;--accent:#6E93FF}
.grain{mix-blend-mode:overlay;opacity:.14}
.eyebrow{font-size:28px;font-weight:500;color:var(--accent);letter-spacing:-.4px}
h1{margin-top:32px;font-size:116px;font-weight:700;line-height:.95;letter-spacing:-5px}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:34px;font-size:32px;font-weight:400;line-height:1.42;color:var(--muted);max-width:760px}
.chart{margin-top:66px;margin-bottom:36px}
.row.mute .fill{background:#4A505C}
.foot{margin-top:auto;display:flex;align-items:center;gap:28px;padding-top:36px;border-top:1px solid var(--rule)}
.btn{padding:22px 46px;background:#F7F6F2;color:#14161A;border-radius:14px;font-size:28px;font-weight:600;letter-spacing:-.5px}
.ghost{font-size:24px;font-weight:500;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<div class="page">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{headline}} <em>{{headlineAccent}}</em></h1>
  <p class="sub">{{body}}</p>
  <div class="chart">
    <div class="axis"></div>
    <div class="row mute"><div class="k">{{bar1Label}}</div><div class="track"><div class="fill" style="width:{{bar1Pct}}%"></div></div><div class="v">{{bar1Val}}</div></div>
    <div class="row"><div class="k">{{bar2Label}}</div><div class="track"><div class="fill" style="width:{{bar2Pct}}%"></div></div><div class="v">{{bar2Val}}</div></div>
  </div>
  <div class="foot"><div class="btn">{{buttonLabel}}</div><div class="ghost">{{signoff}}</div></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="11"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.42"/></svg>
</body></html>
