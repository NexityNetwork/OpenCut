<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#101418;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(16,20,24,.56);--rule:rgba(16,20,24,.14);--accent:#0F766E;--weak:#9AA3AB}
/* Flat, no gradient. The drawn system is the comparison itself: a single rule
   down the centre of the page, which is the axis both sides are read against.
   Two panels carrying identical structure fill symmetrically, so this split
   cannot open the gap a split of unrelated columns always does. */
.ground{position:absolute;inset:0;z-index:0;background:#F4F5F6}
.grain{position:absolute;inset:0;z-index:6;opacity:.18;mix-blend-mode:multiply;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:110px 76px 102px}
/* A grid, not two independent columns. Side by side, each column sized its own
   rows and the rules stopped lining up across the gutter the moment one claim
   ran a line longer — which is exactly the thing a comparison must not do. */
.two{position:relative;flex:1 1 auto;margin-top:66px;display:grid;grid-template-columns:1fr 1fr;column-gap:44px;min-height:0}
.two::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule)}
.cap{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;letter-spacing:-.5px;align-self:end}
.cap .dot{width:15px;height:15px;border-radius:50%;background:var(--weak);flex:0 0 auto}
.cap.good{color:var(--accent)}
.cap.good .dot{background:var(--accent)}
.claim{padding:22px 0 30px;font-size:38px;font-weight:600;line-height:1.18;letter-spacing:-1.3px}
.at{padding:22px 0;border-top:1px solid var(--rule);font-size:26px;font-weight:400;
  line-height:1.32;color:var(--muted);display:flex;align-items:center}
.at.good{color:rgba(16,20,24,.78)}
.two{grid-template-rows:auto auto 1fr 1fr}
.ground{background:#101418}
html,body{color:#F4F5F6}
:root{--muted:rgba(244,245,246,.6);--rule:rgba(244,245,246,.18);--accent:#4FD1C5;--weak:#5A636B}
.grain{mix-blend-mode:overlay;opacity:.14}
.eyebrow{font-size:28px;font-weight:500;color:var(--accent);letter-spacing:-.4px}
h1{margin-top:30px;font-size:114px;font-weight:700;line-height:.95;letter-spacing:-4.9px}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:32px;font-size:32px;font-weight:400;line-height:1.42;color:var(--muted);max-width:760px}
.at.good{color:rgba(244,245,246,.78)}
.foot{margin-top:auto;display:flex;align-items:center;gap:28px;padding-top:34px;border-top:1px solid var(--rule)}
.btn{padding:22px 46px;background:#F4F5F6;color:#101418;border-radius:14px;font-size:28px;font-weight:600;letter-spacing:-.5px}
.ghost{font-size:24px;font-weight:500;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<div class="page">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{headlineLine1}} <em>{{headlineAccent}}</em></h1>
  <p class="sub">{{body}}</p>
  <div class="two">
    <div class="cap"><span class="dot"></span>{{badLabel}}</div>
    <div class="cap good"><span class="dot"></span>{{goodLabel}}</div>
    <div class="claim">{{badClaim}}</div>
    <div class="claim">{{goodClaim}}</div>
    <div class="at">{{bad1}}</div><div class="at good">{{good1}}</div>
    <div class="at">{{bad2}}</div><div class="at good">{{good2}}</div>
  </div>
  <div class="foot"><div class="btn">{{buttonLabel}}</div><div class="ghost">{{signoff}}</div></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="53"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.42"/></svg>
</body></html>
