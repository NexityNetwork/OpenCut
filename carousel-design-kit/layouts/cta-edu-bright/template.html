<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#17170F;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(23,23,15,.56);--rule:rgba(23,23,15,.14);--accent:#E0A93B;--ink:#17170F}
/* Warm paper, flat, no gradient. This family teaches, so the diagrams ARE the
   design — a chart, a flow and a table, each drawn properly instead of four
   competing colours doing the work a structure should do. Two colours: ink and
   one lime, with the lime always carrying ink type on top of it. */
.ground{position:absolute;inset:0;z-index:0;background:#FBF9F3}
.grain{position:absolute;inset:0;z-index:6;opacity:.18;mix-blend-mode:multiply;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:108px 80px 100px}
.head{display:flex;align-items:center;justify-content:space-between;gap:30px}
.head .lbl{font-size:27px;font-weight:600;letter-spacing:-.4px}
.head .tools{display:flex;align-items:center;gap:22px}
.head .tools svg{width:36px;height:36px;display:block}
h2{margin-top:26px;font-size:70px;font-weight:700;line-height:1.03;letter-spacing:-2.9px}
h2 em{font-style:normal;padding:0 2px;
  background:linear-gradient(to top,var(--accent) 0 16px,transparent 16px)}
.sub{margin-top:22px;font-size:29px;font-weight:400;line-height:1.4;color:var(--muted);max-width:880px}
/* One takeaway per page, on a lime bar. It is the only filled element, which is
   what makes it read as the conclusion rather than as decoration. */
.take{margin-top:auto;background:var(--accent);border-radius:14px;padding:30px 34px}
.take .k{font-size:23px;font-weight:600;letter-spacing:-.3px;opacity:.72}
.take .t{margin-top:10px;font-size:33px;font-weight:600;line-height:1.28;letter-spacing:-1.1px}
.ground{background:#17170F}
html,body{color:#F6F4EC}
:root{--muted:rgba(246,244,236,.6);--rule:rgba(246,244,236,.2);--accent:#E0A93B;--ink:#17170F}
.grain{mix-blend-mode:overlay;opacity:.13}
.eyebrow{font-size:28px;font-weight:500;letter-spacing:-.4px;color:var(--accent)}
h1{margin-top:30px;font-size:112px;font-weight:700;line-height:.97;letter-spacing:-4.8px}
h1 em{font-style:normal;padding:0 2px;
  background:linear-gradient(to top,var(--accent) 0 16px,transparent 16px)}
.lede{margin-top:34px;font-size:32px;font-weight:400;line-height:1.4;color:var(--muted);max-width:780px}
.recap{flex:1 1 auto;margin:52px 0 40px;display:flex;flex-direction:column;justify-content:center}
.ix{display:flex;align-items:center;gap:26px;padding:22px 0;border-top:1px solid var(--rule)}
.ix .k{flex:0 0 54px;height:54px;border-radius:50%;border:2px solid rgba(246,244,236,.4);
  display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700}
.ix.hi .k{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.ix .t{font-size:30px;font-weight:500;letter-spacing:-.6px;color:rgba(246,244,236,.86)}
.foot{display:flex;align-items:center;gap:26px;padding-top:32px;border-top:1px solid var(--rule)}
.btn{padding:22px 46px;background:var(--accent);color:var(--ink);border-radius:14px;
  font-size:28px;font-weight:600;letter-spacing:-.5px}
.ghost{font-size:24px;font-weight:500;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<div class="page">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{ctaLine1}} <em>{{ctaAccent}}</em></h1>
  <p class="lede">{{ctaBody}}</p>
  <div class="recap">
    <div class="ix"><div class="k">{{k1}}</div><div class="t">{{recap1}}</div></div>
    <div class="ix"><div class="k">{{k2}}</div><div class="t">{{recap2}}</div></div>
    <div class="ix hi"><div class="k">{{k3}}</div><div class="t">{{recap3}}</div></div>
    <div class="ix"><div class="k">{{k4}}</div><div class="t">{{recap4}}</div></div>
  </div>
  <div class="foot"><div class="btn">{{btnPrimary}}</div><div class="ghost">{{signoff}}</div></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="37"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.42"/></svg>
</body></html>
