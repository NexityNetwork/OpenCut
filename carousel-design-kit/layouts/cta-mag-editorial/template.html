<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FBF7F0;
  font-family:"Lato",sans-serif;color:#17120E;-webkit-font-smoothing:antialiased}
.grain{position:absolute;inset:0;z-index:6;opacity:.13;mix-blend-mode:multiply;pointer-events:none}

.frame{position:absolute;inset:0;padding:58px 72px 54px;display:flex;flex-direction:column}

.headrule{display:flex;height:16px;flex-shrink:0}
.headrule .hr-main{flex:1;background:#17120E}
.headrule .hr-side{width:300px;background:#C8102E}

.kicker{margin-top:22px;font-size:25px;font-weight:700;color:#C8102E;line-height:1.2;flex-shrink:0}

.headline{margin-top:11px;font-family:"Playfair Display",serif;font-weight:900;
  font-size:92px;line-height:1.1;letter-spacing:-2.2px;flex-shrink:0}
.headline .accent{font-style:italic;font-weight:700;color:#C8102E}

.hair{height:2px;background:#17120E;opacity:.24;margin-top:26px;flex-shrink:0}

.spread{flex:1;display:grid;grid-template-columns:600px 1fr;margin-top:28px;min-height:0}
.col-main{padding-right:44px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.col-side{border-left:2px solid rgba(23,18,14,.24);padding-left:34px;
  display:flex;flex-direction:column;justify-content:space-between;min-height:0}

.brk{width:66px;height:5px;background:#C8102E;flex-shrink:0}
.para{font-size:30px;line-height:1.5;color:#2C251E}
.para b{font-weight:700;color:#17120E}
.dropcap{float:left;font-family:"Playfair Display",serif;font-weight:900;color:#C8102E;
  font-size:142px;line-height:.72;margin:9px 15px 0 0}

.note .tick{width:44px;height:5px;background:#C8102E;margin-bottom:12px}
.note .lbl{font-size:25px;font-weight:700;line-height:1.24;color:#17120E}
.note .txt{margin-top:8px;font-size:24px;line-height:1.5;color:#5B5147}
.note .txt b{font-weight:700;color:#17120E}

.coda{margin-top:26px;border-top:3px solid #17120E;padding-top:24px;flex-shrink:0}
.coda .line{font-family:"Playfair Display",serif;font-style:italic;font-weight:700;
  font-size:44px;line-height:1.26;color:#17120E;letter-spacing:-0.6px}

.footrule{display:flex;height:6px;margin-top:24px;flex-shrink:0}
.footrule .fr-main{flex:1;background:#17120E}
.footrule .fr-side{width:300px;background:#C8102E}
</style></head>
<body>
<div class="frame">
  <div class="headrule"><div class="hr-main"></div><div class="hr-side"></div></div>

  <div class="kicker">{{kicker}}</div>
  <h1 class="headline">{{headLine1}}<br>{{headLine2}} <em class="accent">{{headAccent}}</em></h1>
  <div class="hair"></div>

  <div class="spread">
    <div class="col-main">
      <p class="para"><span class="dropcap">{{dropCap}}</span>{{closing}}</p>
      <div class="brk"></div>
      <p class="para">{{closing2}}</p>
    </div>
    <div class="col-side">
      <div class="note">
        <div class="tick"></div>
        <div class="lbl">{{note1Label}}</div>
        <div class="txt">{{note1Body}}</div>
      </div>
      <div class="note">
        <div class="tick"></div>
        <div class="lbl">{{note2Label}}</div>
        <div class="txt">{{note2Body}}</div>
      </div>
      <div class="note">
        <div class="tick"></div>
        <div class="lbl">{{note3Label}}</div>
        <div class="txt">{{note3Body}}</div>
      </div>
    </div>
  </div>

  <div class="coda"><div class="line">{{finalLine}}</div></div>
  <div class="footrule"><div class="fr-main"></div><div class="fr-side"></div></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="41"/>
<feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.45"/></svg>
</body></html>
