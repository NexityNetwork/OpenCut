<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#101A15;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(16,26,21,.58);--rule:rgba(16,26,21,.18);--mint:#A8E8C8}
/* One statement per page, set as large as the frame allows — no other family
   in the set is statement-led, and that is the whole architecture here. The
   condensed face earns its place by letting a full sentence run at display
   size without breaking into five lines. Flat grounds, no gradient. */
.ground{position:absolute;inset:0;z-index:0;background:#F2F3F1}
.grain{position:absolute;inset:0;z-index:6;opacity:.18;mix-blend-mode:multiply;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:104px 80px 96px}
.cond{font-family:"Barlow Condensed",sans-serif}
.label{font-size:26px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
.ground{background:#101A15}
html,body{color:#EAF3EE}
:root{--muted:rgba(234,243,238,.6);--rule:rgba(234,243,238,.2);--mint:#A8E8C8}
.grain{mix-blend-mode:overlay;opacity:.14}
.page{justify-content:space-between}
h1{margin-top:34px;font-size:172px;font-weight:700;line-height:.9;letter-spacing:-5.6px}
h1 span{display:block;font-weight:500;color:var(--mint)}
.sub{margin-top:42px;font-size:33px;font-weight:400;line-height:1.4;color:var(--muted);max-width:700px}
.close{font-size:44px;font-weight:600;line-height:1.24;letter-spacing:-1.6px;max-width:820px}
.foot{margin-top:44px;display:flex;align-items:center;gap:26px;padding-top:32px;border-top:1px solid var(--rule)}
.btn{padding:22px 46px;background:var(--mint);color:#101A15;border-radius:0;font-size:28px;font-weight:600;letter-spacing:-.5px}
.ghost{font-size:24px;font-weight:500;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<div class="page">
  <div>
    <div class="label" style="color:var(--muted)">{{eyebrow}}</div>
    <h1 class="cond"><span>{{ctaQuestion}}</span>{{titleBold}}</h1>
    <p class="sub">{{tagline}}</p>
  </div>
  <div>
    <div class="close">{{closingLine}}</div>
    <div class="foot"><div class="btn">{{buttonLabel}}</div><div class="ghost">{{signoff}}</div></div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" seed="47"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.4"/></svg>
</body></html>
