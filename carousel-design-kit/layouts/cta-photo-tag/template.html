<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#F7F5FC;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(247,245,252,.62);--rule:rgba(247,245,252,.22);--accent:#B9A2F0}

.ground{position:absolute;inset:0;z-index:0;background:#241A3D}
.grain{position:absolute;inset:0;z-index:6;opacity:.16;mix-blend-mode:overlay;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:100px 80px 92px}
.label{font-size:25px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
/* A contact sheet. Each plate is a flat tinted field with its caption set
   beneath it in small type, the way a proof sheet annotates a frame. The plates
   carry text rather than pictures — the family is about looking, not photos. */
.sheet{display:grid;gap:26px}
.plate{background:rgba(247,245,252,.07);border:1px solid rgba(247,245,252,.2);border-radius:4px;
  padding:30px 30px 28px;display:flex;flex-direction:column;justify-content:flex-start}
.plate.on{background:var(--accent);border-color:var(--accent);color:#241A3D}
.plate .t{font-size:31px;font-weight:600;line-height:1.16;letter-spacing:-.9px}
.plate .b{margin-top:16px;font-size:24px;font-weight:400;line-height:1.36;color:var(--muted)}
.plate.on .b{color:rgba(36,26,61,.75)}
.cap{margin-top:12px;font-size:22px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
</style></head>
<body>
<div class="ground"></div>
<div class="page" style="justify-content:space-between">
  <div>
    <div class="label">{{eyebrow}}</div>
    <h1 style="margin-top:28px;font-size:100px;font-weight:700;line-height:1;letter-spacing:-4.1px;max-width:860px">{{titleLine1}} <em style="font-style:normal;color:var(--accent)">{{titleAccent}}</em></h1>
    <p style="margin-top:32px;font-size:31px;font-weight:400;line-height:1.44;color:var(--muted);max-width:720px">{{body}}</p>
  </div>
  <div>
    <div class="sheet" style="grid-template-columns:1fr 1fr;height:340px">
      <div class="plate"><div class="t">{{plate1}}</div><div class="b">{{plate1Body}}</div></div>
      <div class="plate on"><div class="t">{{plate2}}</div><div class="b">{{plate2Body}}</div></div>
    </div>
    <div style="margin-top:32px;display:flex;align-items:center;gap:26px;padding-top:28px;border-top:1px solid var(--rule)">
      <div style="padding:22px 44px;background:var(--accent);color:#241A3D;border-radius:4px;font-size:27px;font-weight:600;letter-spacing:-.4px">{{buttonLabel}}</div>
      <div style="font-size:24px;font-weight:500;color:var(--muted)">{{signoff}}</div>
    </div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" seed="29"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.42"/></svg>
</body></html>
