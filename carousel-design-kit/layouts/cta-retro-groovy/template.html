<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#FBF1E2;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(251,241,226,.66);--rule:rgba(251,241,226,.24);--accent:#F2A277}
/* Flat sand, no gradient. The drawing is a set of concentric arcs rising from
   the bottom edge in bands of the accent — seventies geometry done straight,
   as a frame the type sits above rather than as pastiche. */
.ground{position:absolute;inset:0;z-index:0;background:#3A1B0E}
.draw{position:absolute;inset:0;z-index:1;pointer-events:none}
.grain{position:absolute;inset:0;z-index:6;opacity:.18;mix-blend-mode:overlay;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:100px 82px 92px;
  justify-content:space-between}
.label{font-size:25px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
h1{margin-top:28px;font-size:106px;font-weight:700;line-height:.99;letter-spacing:-4.4px;max-width:860px}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:32px;font-size:32px;font-weight:400;line-height:1.44;color:var(--muted);max-width:720px}
.close{font-size:44px;font-weight:600;line-height:1.24;letter-spacing:-1.6px;max-width:820px}
.foot{margin-top:40px;display:flex;align-items:center;gap:26px;padding-top:28px;border-top:1px solid var(--rule)}
.btn{padding:22px 46px;background:var(--accent);color:#3A1B0E;border-radius:999px;font-size:28px;font-weight:600;letter-spacing:-.5px}
.ghost{font-size:24px;font-weight:500;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<svg class="draw" viewBox="0 0 1080 1350" fill="none">
  <path d="M60 800 A100 100 0 0 1 260 800" fill="none" stroke="#F2A277" stroke-opacity="0.26" stroke-width="26"/>
  <path d="M4 800 A156 156 0 0 1 316 800" fill="none" stroke="#F2A277" stroke-opacity="0.23" stroke-width="26"/>
  <path d="M-52 800 A212 212 0 0 1 372 800" fill="none" stroke="#F2A277" stroke-opacity="0.20" stroke-width="26"/>
  <path d="M-108 800 A268 268 0 0 1 428 800" fill="none" stroke="#F2A277" stroke-opacity="0.18" stroke-width="26"/>
  <path d="M-164 800 A324 324 0 0 1 484 800" fill="none" stroke="#F2A277" stroke-opacity="0.15" stroke-width="26"/>
</svg>
<div class="page">
  <div>
    <div class="label">{{eyebrow}}</div>
    <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
    <p class="sub">{{body}}</p>
  </div>
  <div>
    <div class="close">{{closingLine}}</div>
    <div class="foot"><div class="btn">{{buttonLabel}}</div><div class="ghost">{{signoff}}</div></div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" seed="55"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.42"/></svg>
</body></html>
