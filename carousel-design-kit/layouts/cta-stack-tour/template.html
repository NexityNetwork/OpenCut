<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#101418;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(16,20,24,.58);--rule:rgba(16,20,24,.16);--accent:#3E5F80}
/* Flat dark, no gradient. The drawing is an exploded axonometric: flat
   parallelograms stacked in isometric projection with a gap between each, drawn
   at precise angles and labelled to the side. A diagram, not an ornament. */
.ground{position:absolute;inset:0;z-index:0;background:#EAF0F6}
.draw{position:absolute;inset:0;z-index:1;pointer-events:none}
.grain{position:absolute;inset:0;z-index:6;opacity:.14;mix-blend-mode:multiply;pointer-events:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;z-index:4;padding:100px 80px 92px;
  justify-content:space-between}
.label{font-size:25px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
.keys{display:flex;flex-direction:column}
.key{display:flex;gap:26px;padding:24px 0;border-top:1px solid var(--rule);align-items:baseline}
.key .n{flex:0 0 250px;font-size:27px;font-weight:600;letter-spacing:-.5px}
.key .n.on{color:var(--accent)}
.key .v{font-size:25px;font-weight:400;line-height:1.38;color:var(--muted)}
h1{margin-top:26px;font-size:100px;font-weight:700;line-height:1;letter-spacing:-4.1px;max-width:860px}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin-top:30px;font-size:31px;font-weight:400;line-height:1.44;color:var(--muted);max-width:700px}
.close{font-size:40px;font-weight:600;line-height:1.24;letter-spacing:-1.4px;max-width:800px}
.foot{margin-top:32px;display:flex;align-items:center;gap:26px;padding-top:26px;border-top:1px solid var(--rule)}
.btn{padding:22px 46px;background:var(--accent);color:#EAF0F6;border-radius:10px;font-size:28px;font-weight:600;letter-spacing:-.5px}
.ghost{font-size:24px;font-weight:500;color:var(--muted)}
</style></head>
<body>
<div class="ground"></div>
<svg class="draw" viewBox="0 0 1080 1350" fill="none">
  <g opacity="0.5"><path d="M300 806 l240 -13.0 l240 13.0 l-240 13.0 Z" fill="#CBD8E4" stroke="#5C7A96" stroke-width="1.6"/><path d="M300 806 l240 13.0 l0 26 l-240 -13.0 Z" fill="#CBD8E4" fill-opacity=".55" stroke="#5C7A96" stroke-width="1.6"/><path d="M540 819.0 l240 -13.0 l0 26 l-240 13.0 Z" fill="#CBD8E4" fill-opacity=".3" stroke="#5C7A96" stroke-width="1.6"/></g>
  <g opacity="1.0"><path d="M300 898 l240 -13.0 l240 13.0 l-240 13.0 Z" fill="#3E5F80" stroke="#5C7A96" stroke-width="1.6"/><path d="M300 898 l240 13.0 l0 26 l-240 -13.0 Z" fill="#3E5F80" fill-opacity=".55" stroke="#5C7A96" stroke-width="1.6"/><path d="M540 911.0 l240 -13.0 l0 26 l-240 13.0 Z" fill="#3E5F80" fill-opacity=".3" stroke="#5C7A96" stroke-width="1.6"/></g>
  <g opacity="0.5"><path d="M300 990 l240 -13.0 l240 13.0 l-240 13.0 Z" fill="#CBD8E4" stroke="#5C7A96" stroke-width="1.6"/><path d="M300 990 l240 13.0 l0 26 l-240 -13.0 Z" fill="#CBD8E4" fill-opacity=".55" stroke="#5C7A96" stroke-width="1.6"/><path d="M540 1003.0 l240 -13.0 l0 26 l-240 13.0 Z" fill="#CBD8E4" fill-opacity=".3" stroke="#5C7A96" stroke-width="1.6"/></g>
</svg>
<div class="page">
  <div>
    <div class="label">{{eyebrow}}</div>
    <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
    <p class="sub">{{body}}</p>
  </div>
  <div>
    <div class="close">{{closingLine}}</div>
    <div class="foot"><div class="btn">{{buttonLabel}}</div><div class="ghost">{{signoff}}</div></div>
  </div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="3" seed="45"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.5"/></svg>
</body></html>
