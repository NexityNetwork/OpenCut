<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FAFAF8;color:#111211;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(17,18,17,.56);--rule:rgba(17,18,17,.13);--accent:#E1251B}
/* Six columns of 130 with 24px gutters inside a 90px margin: 6x130 + 5x24 = 900.
   The column hairlines are drawn full-bleed and left visible, so the measure is
   the design and white space is ruled rather than empty. */
.grid{position:absolute;inset:0;z-index:1;pointer-events:none}
.page{position:absolute;inset:0;z-index:3;padding:112px 90px 104px;display:flex;flex-direction:column}
.eyebrow{font-size:25px;font-weight:500;color:var(--accent);letter-spacing:-.3px}
h1{margin-top:26px;width:746px;font-size:112px;font-weight:700;line-height:.97;letter-spacing:-4.8px}
h1 em{font-style:normal;color:var(--accent)}
.stand{margin-top:30px;width:592px;font-size:31px;font-weight:400;line-height:1.42;color:var(--muted)}
/* The closer is the one page where the full measure is filled rather than ruled.
   It bleeds past the margins while its type stays on the grid, and the columns
   carry through it in the reverse tone so the structure survives the flood. */
.flood{position:relative;flex:1;margin:44px -90px 0;padding:0 90px;background:var(--accent);
  display:flex;align-items:center;color:#FAFAF8}
.flood .cols{position:absolute;inset:0;pointer-events:none}
.flood p{position:relative;width:746px;font-size:54px;font-weight:600;line-height:1.16;letter-spacing:-2.1px}
.foot{margin-top:40px;display:flex;align-items:center;gap:26px;padding-top:24px;border-top:2px solid #111211}
.btn{padding:19px 40px;background:#111211;color:#FAFAF8;font-size:26px;font-weight:600;letter-spacing:-.4px}
.ghost{font-size:24px;font-weight:400;color:var(--muted)}
</style></head>
<body>
<svg class="grid" viewBox="0 0 1080 1350" fill="none">
  <g stroke="rgba(17,18,17,.13)" stroke-width="1">
    <path d="M90 0 V1350 M244 0 V1350 M398 0 V1350 M552 0 V1350 M706 0 V1350 M860 0 V1350 M990 0 V1350"/>
  </g>
</svg>
<div class="page">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
  <p class="stand">{{body}}</p>
  <div class="flood">
    <svg class="cols" viewBox="0 0 1080 10" preserveAspectRatio="none" fill="none">
      <g stroke="rgba(250,250,248,.42)" stroke-width="1" vector-effect="non-scaling-stroke">
        <path d="M90 0 V10 M244 0 V10 M398 0 V10 M552 0 V10 M706 0 V10 M860 0 V10 M990 0 V10"/>
      </g>
    </svg>
    <p>{{closingLine}}</p>
  </div>
  <div class="foot"><div class="btn">{{buttonLabel}}</div><div class="ghost">{{signoff}}</div></div>
</div>
</body></html>
