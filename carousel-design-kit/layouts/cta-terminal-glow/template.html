<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#08090A;color:#E6EDE8;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(230,237,232,.54);--rule:rgba(92,230,138,.22);--accent:#5CE68A}
/* Fine horizontal scan lines are the ground and the only texture on the page.
   On the last page the lit register grows to hold the closing statement, and
   the scan carries across it in the reverse tone. */
.scan{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    rgba(92,230,138,.085) 0px, rgba(92,230,138,.085) 1px, transparent 1px, transparent 3px)}
.page{position:absolute;inset:0;z-index:3;padding:114px 92px 104px;display:flex;flex-direction:column}
.eyebrow{font-size:25px;font-weight:500;color:var(--accent);letter-spacing:-.3px}
h1{margin-top:26px;font-size:104px;font-weight:700;line-height:1;letter-spacing:-4.4px;max-width:820px}
h1 em{font-style:normal;color:var(--accent)}
.stand{margin-top:30px;font-size:32px;font-weight:400;line-height:1.42;color:var(--muted);max-width:800px}
.lit{position:relative;flex:1;margin:48px -92px 0;padding:0 92px;background:var(--accent);color:#08090A;
  display:flex;align-items:center;overflow:hidden}
.lit .over{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    rgba(8,9,10,.13) 0px, rgba(8,9,10,.13) 1px, transparent 1px, transparent 4px)}
.lit p{position:relative;font-size:54px;font-weight:600;line-height:1.16;letter-spacing:-2.1px;max-width:830px}
.foot{margin-top:38px;display:flex;align-items:center;gap:24px}
.btn{padding:18px 38px;background:var(--accent);color:#08090A;font-size:26px;font-weight:600;letter-spacing:-.4px}
.ghost{font-size:24px;color:var(--muted)}
</style></head>
<body>
<div class="scan"></div>
<div class="page">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
  <p class="stand">{{body}}</p>
  <div class="lit"><div class="over"></div><p>{{closingLine}}</p></div>
  <div class="foot"><div class="btn">{{buttonLabel}}</div><div class="ghost">{{signoff}}</div></div>
</div>
</body></html>
