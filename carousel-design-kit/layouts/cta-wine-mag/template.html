<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;color:#2A0812;
  font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--muted:rgba(0,0,0,.62);--rule:rgba(0,0,0,.16);--accent:#F0879B}
/* Four saturated stops that ARE the ground, with grain over the top so a rich
   gradient does not band on export. The drawn object is frosted glass with a
   real drop shadow, rotated off-axis — a spinoff gets its own object, not a
   recolour of somebody else's. */
.mesh{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 16% 14%, #F6C9D2 0%, transparent 56%),
  radial-gradient(100% 80% at 86% 8%,  #FDE8EC 0%, transparent 52%),
  radial-gradient(120% 95% at 76% 90%, #EE9DAE 0%, transparent 58%),
  radial-gradient(110% 90% at 6% 92%,  #FFF6F8 0%, transparent 54%),
  #FEF6F8}
.grain{position:absolute;inset:0;z-index:1;opacity:.28;mix-blend-mode:multiply;pointer-events:none}
.obj{position:absolute;z-index:2;pointer-events:none}
.sheet{position:absolute;inset:0;padding:118px 84px 104px;display:flex;flex-direction:column;
  justify-content:space-between;z-index:4}
.eyebrow{font-size:28px;font-weight:500;letter-spacing:-.4px;opacity:.66}
h1{margin-top:30px;font-size:116px;font-weight:700;line-height:.96;letter-spacing:-4.9px;max-width:820px}
h1 em{font-style:normal;opacity:.5}
.sub{margin-top:34px;font-size:32px;font-weight:400;line-height:1.42;color:var(--muted);max-width:620px}
.foot{display:flex;align-items:center;gap:26px;padding-top:36px;border-top:1px solid var(--rule)}
.btn{padding:22px 46px;background:#2A0812;color:#FEF6F8;border-radius:14px;
  font-size:28px;font-weight:600;letter-spacing:-.5px}
.ghost{font-size:24px;font-weight:500;color:var(--muted)}
.obj{right:-186px;top:452px;width:540px;height:500px;transform:rotate(-5deg);opacity:.5}
</style></head>
<body>
<div class="mesh"></div>
<svg class="obj" viewBox="0 0 540 540" fill="none">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".30"/><stop offset="1" stop-color="#000" stop-opacity=".06"/>
    </linearGradient>
    <filter id="osh" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0" dy="32" stdDeviation="32" flood-color="#1E050C" flood-opacity=".5"/>
    </filter>
  </defs>
  <g filter="url(#osh)">
    <rect x="34" y="34" width="472" height="472" rx="34" fill="url(#og)" stroke="rgba(0,0,0,.40)" stroke-width="2.5"/>
    <rect x="106" y="106" width="328" height="328" rx="26" stroke="rgba(0,0,0,.44)" stroke-width="2.5" fill="rgba(0,0,0,.07)"/>
    <rect x="178" y="178" width="184" height="184" rx="18" stroke="rgba(0,0,0,.5)" stroke-width="2.5" fill="rgba(0,0,0,.08)"/>
    <rect x="238" y="238" width="64"  height="64"  rx="10" stroke="rgba(0,0,0,.6)" stroke-width="2.5" fill="rgba(0,0,0,.12)"/>
    <g stroke="rgba(0,0,0,.26)" stroke-width="2">
      <path d="M34 34 L238 238"/><path d="M506 34 L302 238"/>
      <path d="M34 506 L238 302"/><path d="M506 506 L302 302"/>
    </g>
  </g>
</svg>
<div class="sheet">
  <div>
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{titleLine1}} <em>{{titleAccent}}</em></h1>
  <p class="sub">{{body}}</p>
  </div>
  <div class="foot"><div class="btn">{{btnPrimary}}</div><div class="ghost">{{signoff}}</div></div>
</div>
<svg class="grain" width="1080" height="1350" viewBox="0 0 1080 1350" preserveAspectRatio="none">
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="12"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="1080" height="1350" filter="url(#gr)" opacity="0.55"/></svg>
</body></html>
